<style>
:root {
  --azul:#0164C8; --azul-2:#0150a8; --azul-escuro:#103C9B; --azul-claro:#1EAAFF; --ciano:#19FAFF; --marca-claro:#e8f1fc;
  --fundo:#f3f4fa; --card:#ffffff; --card-2:#f8f9fd; --borda:#e3e6f0; --texto:#1b1e2e; --muted:#6b7088;
  --sombra:0 1px 2px rgba(20,30,70,.06), 0 8px 24px rgba(20,30,70,.08);
  --sombra-forte:0 12px 40px rgba(20,30,70,.18);
  --raio:16px;
  /* fases (PDF) */
  --f-empatizar:#ec2f8f; --f-definir:#6a11b8; --f-idear:#3d0a91; --f-prototipar:#3b4fd8; --f-testar:#3fb8ee; --f-pitch:#f6a5c0;
  /* CSD */
  --c-certeza:#ff6464; --c-suposicao:#ffb000; --c-duvida:#46c552;
  --n-certeza:#ffe3e3; --n-suposicao:#fff1c9; --n-duvida:#ddf6df;
  /* Plano 5W */
  --p-oque:#ffb000; --p-como:#ff6464; --p-onde:#001e82; --p-quando:#41c463; --p-quem:#5520c4;
  /* GUT */
  --g1:#d9d9d9; --g2:#d9dff2; --g3:#ffe699; --g4:#ffc000; --g5:#ff1f1f;
  --ok:#1b8a4a; --aviso:#e58a00; --erro:#d93025;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fundo:#0f1220; --card:#181c2e; --card-2:#1f2438; --borda:#2a3050; --texto:#e8eaf4; --muted:#9aa0bd;
    --marca-claro:#1a2a4a; --sombra:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --n-certeza:#4a2328; --n-suposicao:#4a3b17; --n-duvida:#1d4224;
  }
}
:root[data-theme="dark"] {
  --fundo:#0f1220; --card:#181c2e; --card-2:#1f2438; --borda:#2a3050; --texto:#e8eaf4; --muted:#9aa0bd;
  --marca-claro:#1a2a4a; --sombra:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --n-certeza:#4a2328; --n-suposicao:#4a3b17; --n-duvida:#1d4224;
}
* { box-sizing:border-box; }
html,body { margin:0; }
body { font-family:Inter, system-ui, sans-serif; background:var(--fundo); color:var(--texto); font-size:14px; line-height:1.45;
  background-image: radial-gradient(1200px 500px at 90% -10%, rgba(106,17,184,.10), transparent 60%), radial-gradient(900px 400px at -10% 10%, rgba(1,100,200,.10), transparent 60%);
  background-attachment: fixed; min-height:100vh; }
button { font:inherit; color:inherit; }
.muted { color:var(--muted); } .small { font-size:12px; }

/* ---------- header ---------- */
header.top { position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:20px; padding:0 24px; height:64px;
  background:color-mix(in srgb, var(--card) 78%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom:1px solid var(--borda); }
.logo { display:flex; align-items:center; gap:10px; font-weight:800; font-size:19px; letter-spacing:-.3px; color:var(--texto); text-decoration:none; white-space:nowrap; }
.logo img { height:30px; border-radius:6px; background:#fff; padding:2px; }
.logo span b { background:linear-gradient(90deg,var(--f-empatizar),var(--f-definir),var(--azul)); -webkit-background-clip:text; background-clip:text; color:transparent; }
nav.menu { display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; }
nav.menu a { padding:8px 14px; border-radius:99px; color:var(--muted); text-decoration:none; font-weight:600; white-space:nowrap; transition:.2s; }
nav.menu a:hover { color:var(--texto); background:var(--card-2); }
nav.menu a.ativo { color:#fff; background:var(--azul); box-shadow:0 4px 14px rgba(1,100,200,.35); }
.top-dir { margin-left:auto; display:flex; align-items:center; gap:10px; }
.icon-btn { width:38px; height:38px; border-radius:50%; border:1px solid var(--borda); background:var(--card); cursor:pointer; display:grid; place-items:center; transition:.2s; }
.icon-btn:hover { transform:rotate(15deg); }
.eu { width:38px; height:38px; }

main { max-width:1240px; margin:0 auto; padding:24px 20px 80px; }
.view { display:none; animation: entra .45s cubic-bezier(.2,.8,.2,1); }
.view.ativa { display:block; }
@keyframes entra { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

.card { background:var(--card); border:1px solid var(--borda); border-radius:var(--raio); box-shadow:var(--sombra); padding:20px; }
.btn { display:inline-flex; align-items:center; gap:8px; border:0; background:var(--azul); color:#fff; padding:10px 18px; border-radius:12px; font-weight:600; cursor:pointer;
  transition: transform .15s, box-shadow .2s, background .2s; box-shadow:0 4px 14px rgba(1,100,200,.28); }
.btn:hover { transform:translateY(-1px); background:var(--azul-2); }
.btn:active { transform:translateY(1px) scale(.98); }
.btn.sec { background:var(--card); color:var(--texto); border:1px solid var(--borda); box-shadow:none; }
.btn.sec:hover { background:var(--card-2); }
.btn.grad { background:linear-gradient(135deg,var(--f-empatizar),var(--f-definir) 55%,var(--azul)); box-shadow:0 6px 22px rgba(106,17,184,.35); }
.btn.peq { padding:6px 12px; font-size:12px; border-radius:10px; }

/* ---------- avatares ---------- */
.av { --c:#888; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:700; font-size:12px; background:var(--c);
  border:2px solid var(--card); position:relative; flex:none; }
.av.on::after { content:""; position:absolute; right:-1px; bottom:-1px; width:10px; height:10px; border-radius:50%; background:#2ecc71; border:2px solid var(--card); }
.av.mini { width:22px; height:22px; font-size:9px; border-width:1.5px; }
.avs { display:flex; } .avs .av + .av { margin-left:-5px; }

/* ---------- hero do time ---------- */
.hero { display:grid; grid-template-columns: 1fr auto; gap:20px; align-items:center; padding:24px; position:relative; overflow:hidden;
  background: linear-gradient(120deg, #13389a, #3d0a91 55%, #6a11b8); color:#fff; border:0; }
.hero::before { content:""; position:absolute; width:380px; height:380px; right:-80px; top:-160px; border-radius:50%; background:radial-gradient(circle, rgba(236,47,143,.55), transparent 65%); }
.hero::after { content:""; position:absolute; width:260px; height:260px; left:35%; bottom:-170px; border-radius:50%; background:radial-gradient(circle, rgba(63,184,238,.45), transparent 65%); }
.hero > * { position:relative; z-index:1; }
.hero .kicker { text-transform:uppercase; letter-spacing:1.4px; font-size:11px; font-weight:700; opacity:.8; }
.hero h1 { margin:4px 0 6px; font-size:26px; letter-spacing:-.5px; }
.hero .problema { opacity:.9; max-width:640px; }
.hero .avs .av { border-color:#3d0a91; }
.hero-dir { display:flex; flex-direction:column; align-items:flex-end; gap:12px; }
.countdown { display:flex; gap:6px; }
.countdown div { background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.2); border-radius:12px; padding:8px 10px; text-align:center; min-width:56px; }
.countdown b { display:block; font-size:22px; font-variant-numeric:tabular-nums; }
.countdown span { font-size:10px; text-transform:uppercase; letter-spacing:1px; opacity:.8; }
.countdown.aviso div { background:rgba(229,138,0,.35); } .countdown.urgente div { background:rgba(217,48,37,.45); animation:pulsa 1.2s infinite; }
@keyframes pulsa { 50% { transform:scale(1.04); } }
.progresso { width:100%; margin-top:14px; }
.barra { height:10px; background:rgba(255,255,255,.18); border-radius:99px; overflow:hidden; }
.barra i { display:block; height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,#3fb8ee,#f6a5c0,#ec2f8f); transition:width 1s cubic-bezier(.2,.8,.2,1); }

/* ---------- trilha de fases ---------- */
.trilha { display:flex; align-items:flex-start; justify-content:space-between; margin:26px 0 22px; padding:0 8px; position:relative; }
.trilha::before { content:""; position:absolute; left:6%; right:6%; top:32px; height:4px; border-radius:4px; background:var(--borda); }
.trilha .linha-prog { position:absolute; left:6%; top:32px; height:4px; border-radius:4px; background:linear-gradient(90deg,var(--f-empatizar),var(--f-definir),var(--f-idear),var(--f-prototipar)); transition:width .8s; }
.fase { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; background:none; border:0; padding:0; width:16%; }
.fase .bola { width:64px; height:64px; border-radius:50%; display:grid; place-items:center; background:var(--fc); color:#fff; box-shadow:0 0 0 5px var(--fundo), 0 6px 18px color-mix(in srgb, var(--fc) 45%, transparent);
  transition: transform .3s cubic-bezier(.3,1.6,.5,1); position:relative; }
.fase .bola svg { width:28px; height:28px; }
.fase .nome { font-weight:700; font-size:12px; letter-spacing:.8px; text-transform:uppercase; color:var(--fc); }
.fase .sub { font-size:11px; color:var(--muted); margin-top:-6px; }
.fase:hover .bola { transform:scale(1.08); }
.fase.atual .nome { margin-top:8px; }
.fase.atual .bola { transform:scale(1.22); box-shadow:0 0 0 5px var(--fundo), 0 0 0 9px color-mix(in srgb, var(--fc) 30%, transparent), 0 10px 26px color-mix(in srgb, var(--fc) 55%, transparent); }
.fase.bloq .bola { filter:grayscale(1) opacity(.45); }
.fase.bloq .nome { color:var(--muted); }
.fase .cadeado, .fase .selo { position:absolute; right:-6px; top:-6px; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:12px; }
.fase .cadeado { background:var(--card); border:1px solid var(--borda); }
.fase .selo { background:linear-gradient(135deg,#ffd54a,#f59e0b); box-shadow:0 2px 8px rgba(245,158,11,.6); color:#fff; animation:carimbo .6s cubic-bezier(.3,1.8,.5,1); }
@keyframes carimbo { from { transform:scale(0) rotate(-90deg); } to { transform:none; } }

/* ---------- painel do instrumento ---------- */
.inst-head { display:flex; align-items:center; gap:14px; margin-bottom:16px; flex-wrap:wrap; }
.inst-head h2 { margin:0; font-size:22px; letter-spacing:-.4px; }
.inst-head .chip { padding:4px 10px; border-radius:99px; font-size:12px; font-weight:600; background:var(--marca-claro); color:var(--azul); }
.inst-head .espaco { flex:1; }
.inst { display:none; } .inst.ativo { display:block; animation: entra .4s; }

/* ---------- GUT ---------- */
.gut-grid { display:grid; grid-template-columns: 1.25fr 1fr; gap:18px; }
.gut-item { display:grid; grid-template-columns: 1fr auto; gap:10px 16px; padding:14px 16px; border-radius:14px; border:1px solid var(--borda); background:var(--card);
  margin-bottom:10px; transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .2s, border-color .2s; position:relative; }
.gut-item:hover { box-shadow:var(--sombra); }
.gut-item.destaque { border-color:var(--azul); box-shadow:0 0 0 3px color-mix(in srgb,var(--azul) 25%, transparent); }
.gut-item.escolhido { border:2px solid #f59e0b; background:linear-gradient(135deg, color-mix(in srgb,#ffd54a 14%, var(--card)), var(--card)); }
.gut-item .txt { font-weight:600; }
.gut-item .rank { position:absolute; left:-12px; top:12px; width:24px; height:24px; border-radius:50%; background:var(--texto); color:var(--card); font-size:11px; font-weight:800; display:grid; place-items:center; }
.gut-escalas { grid-column:1 / -1; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.escala .rot { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin-bottom:4px; }
.escala .chips { display:flex; gap:4px; }
.escala button { flex:1; height:30px; border-radius:8px; border:1px solid var(--borda); background:var(--card-2); cursor:pointer; font-weight:700; font-size:12px; transition:.15s; position:relative; }
.escala button:hover { transform:translateY(-2px); }
.escala button.on { color:#1b1e2e; border-color:transparent; transform:translateY(-1px); box-shadow:0 3px 10px rgba(0,0,0,.15); }
.escala button.on[data-v="5"] { color:#fff; }
.escala button[data-tip]:hover::after { content:attr(data-tip); position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%); white-space:nowrap; background:#1b1e2e; color:#fff;
  padding:5px 8px; border-radius:6px; font-size:11px; font-weight:500; z-index:5; pointer-events:none; }
.grau { text-align:center; min-width:76px; }
.grau b { display:block; font-size:28px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
.grau span { font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); }
.grau .pill { display:inline-block; margin-top:6px; padding:2px 8px; border-radius:99px; font-size:10px; font-weight:700; }
.coroa-btn { grid-column:1 / -1; justify-self:start; }
.mapa { position:sticky; top:84px; }
.mapa svg { width:100%; height:auto; display:block; }
.mapa .bolha { cursor:pointer; transition: r .5s cubic-bezier(.3,1.5,.5,1), cx .6s cubic-bezier(.2,.8,.2,1), cy .6s cubic-bezier(.2,.8,.2,1), opacity .2s; }
.mapa .bolha:hover { opacity:.85; }
.legenda-gut { display:flex; gap:6px; align-items:center; font-size:11px; color:var(--muted); margin-top:8px; flex-wrap:wrap; }
.legenda-gut i { width:22px; height:10px; border-radius:4px; display:inline-block; }
.novo-item { display:flex; gap:8px; margin-top:6px; }
.novo-item input, .add-nota input { flex:1; padding:11px 14px; border-radius:12px; border:1.5px dashed var(--borda); background:var(--card); color:var(--texto); font:inherit; transition:.2s; }
.novo-item input:focus, .add-nota input:focus { outline:0; border-style:solid; border-color:var(--azul); box-shadow:0 0 0 3px color-mix(in srgb,var(--azul) 20%,transparent); }

/* ---------- CSD ---------- */
.foco { display:flex; gap:12px; align-items:center; padding:12px 16px; border-radius:14px; background:linear-gradient(135deg, color-mix(in srgb,#ffd54a 22%, var(--card)), var(--card)); border:1px solid color-mix(in srgb,#f59e0b 40%, var(--borda)); margin-bottom:16px; }
.foco .k { font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:#b45309; }
.csd { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.coluna { border-radius:18px; background:var(--card-2); border:1px solid var(--borda); padding:0 12px 12px; min-height:420px; display:flex; flex-direction:column; }
.coluna-head { margin:0 -12px 12px; padding:14px 16px; border-radius:18px 18px 0 0; color:#fff; background:var(--cc); }
.coluna-head h3 { margin:0; font-size:16px; letter-spacing:1px; text-transform:uppercase; display:flex; justify-content:space-between; }
.coluna-head p { margin:2px 0 0; font-size:12px; opacity:.92; }
.notas { flex:1; display:flex; flex-direction:column; gap:10px; min-height:60px; }
.nota { background:var(--nc); padding:12px 12px 10px; border-radius:4px 4px 14px 4px; box-shadow:0 2px 0 rgba(0,0,0,.04), 0 6px 14px rgba(0,0,0,.08);
  font-family: Caveat, Inter, cursive; font-size:20px; line-height:1.15; cursor:grab; position:relative; transform:rotate(var(--rot,0deg));
  transition: transform .2s, box-shadow .2s; animation: pousa .45s cubic-bezier(.3,1.5,.5,1); }
.nota:hover { transform:rotate(0) translateY(-2px) scale(1.02); box-shadow:0 10px 24px rgba(0,0,0,.14); }
@keyframes pousa { from { opacity:0; transform:translateY(-14px) rotate(-6deg) scale(.9); } }
.nota .rodape { display:flex; align-items:center; justify-content:space-between; margin-top:8px; font-family:Inter; font-size:11px; color:var(--muted); }
.nota .plano-btn { border:0; border-radius:99px; padding:3px 9px; font-size:11px; font-weight:700; cursor:pointer; background:rgba(0,0,0,.08); }
.nota .plano-btn.on { background:var(--p-quem); color:#fff; }
.sortable-ghost { opacity:.35; } .sortable-chosen { cursor:grabbing; }
.add-nota { display:flex; margin-top:10px; }

/* ---------- Plano ---------- */
.planos { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px; }
.plano { border-radius:18px; overflow:hidden; background:var(--card); border:1px solid var(--borda); box-shadow:var(--sombra); animation: entra .5s; }
.plano .origem { padding:10px 14px; font-size:12px; background:var(--card-2); border-bottom:1px solid var(--borda); display:flex; gap:8px; align-items:center; }
.plano .origem .tag { padding:2px 8px; border-radius:99px; color:#fff; font-weight:700; font-size:10px; text-transform:uppercase; }
.w { display:grid; grid-template-columns:88px 1fr; border-bottom:1px solid var(--borda); }
.w:last-child { border-bottom:0; }
.w .k { background:var(--wc); color:#fff; font-weight:700; font-size:12px; padding:10px; display:flex; align-items:center; }
.w .v { padding:10px 12px; outline:0; min-height:40px; }
.w .v:focus { background:color-mix(in srgb,var(--wc) 8%, var(--card)); }
.w .v:empty::before { content:attr(data-ph); color:var(--muted); }

/* ---------- Brainstorm ---------- */
.bs-modo { display:inline-flex; padding:4px; background:var(--card-2); border:1px solid var(--borda); border-radius:12px; }
.bs-modo button { border:0; background:none; padding:7px 14px; border-radius:9px; font-weight:600; cursor:pointer; color:var(--muted); }
.bs-modo button.on { background:var(--card); color:var(--texto); box-shadow:var(--sombra); }
.quadros { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
.quadro { border-radius:18px; background:var(--card-2); border:1px solid var(--borda); padding:46px 14px 14px; position:relative; min-height:220px; }
.quadro .etq { position:absolute; left:14px; top:-14px; background:var(--qc); color:#fff; padding:9px 16px; border-radius:10px 10px 10px 0; font-weight:700; box-shadow:0 6px 16px color-mix(in srgb,var(--qc) 45%, transparent); }
.quadro .principal { font-weight:700; font-size:16px; margin-bottom:4px; display:flex; gap:8px; align-items:center; }
.quadro .apoios { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; min-height:60px; }
.quadro .apoios .nota { width:calc(50% - 5px); font-size:18px; --nc:#fff6b8; }
:root[data-theme="dark"] .quadro .apoios .nota { --nc:#4a4520; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .quadro .apoios .nota { --nc:#4a4520; } }
.ranking { max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:10px; }
.rk { display:grid; grid-template-columns:56px 1fr auto; gap:14px; align-items:center; padding:14px 16px; border-radius:16px; background:var(--card); border:1px solid var(--borda); box-shadow:var(--sombra); cursor:grab; transition:.2s; }
.rk:hover { transform:translateX(4px); }
.rk .pos { width:44px; height:44px; border-radius:14px; display:grid; place-items:center; font-weight:800; font-size:18px; background:var(--card-2); }
.rk:nth-child(1) .pos { background:linear-gradient(135deg,#ffe07a,#f59e0b); color:#fff; box-shadow:0 4px 14px rgba(245,158,11,.5); }
.rk:nth-child(2) .pos { background:linear-gradient(135deg,#e5e7eb,#9ca3af); color:#fff; }
.rk:nth-child(3) .pos { background:linear-gradient(135deg,#f3c39b,#c2703d); color:#fff; }
.rk .tt { font-weight:700; } .rk .ds { font-size:12px; color:var(--muted); }
.alca { color:var(--muted); font-size:18px; }

.rodape-etapa { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; align-items:center; }

/* ---------- Sorteio ---------- */
.sorteio { display:grid; grid-template-columns:320px 1fr; gap:20px; }
.pessoas { max-height:620px; overflow:auto; display:flex; flex-direction:column; gap:6px; }
.pessoa { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:12px; background:var(--card-2); transition:.3s; }
.pessoa.saiu { opacity:.25; transform:scale(.97); }
.dep { padding:2px 8px; border-radius:99px; font-size:10px; font-weight:700; color:#fff; background:var(--dc); white-space:nowrap; }
.palco { display:flex; flex-direction:column; gap:18px; }
.slot { height:130px; border-radius:22px; display:grid; place-items:center; position:relative; overflow:hidden; color:#fff;
  background: linear-gradient(120deg, #13389a, #3d0a91 55%, #6a11b8); box-shadow:var(--sombra-forte); }
.slot .nome-slot { font-size:38px; font-weight:800; letter-spacing:-.8px; text-align:center; }
.slot .nome-slot small { display:block; font-size:13px; font-weight:600; opacity:.8; letter-spacing:0; }
.slot.girando .nome-slot { filter: blur(1.5px); }
.times-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
.time-card { border-radius:18px; background:var(--card); border:1px solid var(--borda); box-shadow:var(--sombra); overflow:hidden; }
.time-card h4 { margin:0; padding:12px 14px; color:#fff; background:var(--tc); display:flex; justify-content:space-between; align-items:center; }
.time-card ul { list-style:none; margin:0; padding:10px; display:flex; flex-direction:column; gap:6px; min-height:60px; }
.time-card li { display:flex; align-items:center; gap:8px; font-size:13px; animation: cai .55s cubic-bezier(.3,1.6,.5,1); }
@keyframes cai { from { opacity:0; transform:translateY(-24px) scale(.6); } }
.mix { display:flex; gap:3px; padding:0 14px 12px; }
.mix i { height:6px; flex:1; border-radius:4px; background:var(--dc); }
.voador { position:fixed; z-index:100; pointer-events:none; padding:8px 14px; border-radius:99px; background:#fff; color:#1b1e2e; font-weight:700; box-shadow:var(--sombra-forte);
  transition: all .7s cubic-bezier(.5,0,.2,1); }

/* ---------- Painel ao vivo ---------- */
.ao-vivo { display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:99px; background:color-mix(in srgb,var(--erro) 14%, var(--card)); color:var(--erro); font-weight:700; font-size:12px; letter-spacing:1px; }
.ao-vivo::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--erro); animation:piscar 1.2s infinite; }
@keyframes piscar { 50% { opacity:.2; } }
.painel { display:grid; grid-template-columns: 1fr 320px; gap:20px; }
.painel-times { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px; }
.pt { padding:16px; border-radius:18px; background:var(--card); border:1px solid var(--borda); box-shadow:var(--sombra); position:relative; overflow:hidden; }
.pt::before { content:""; position:absolute; inset:0 0 auto 0; height:4px; background:var(--tc); }
.pt h4 { margin:2px 0 10px; display:flex; justify-content:space-between; align-items:center; }
.mini-trilha { display:flex; gap:6px; margin:10px 0; }
.mini-trilha span { flex:1; height:8px; border-radius:99px; background:var(--borda); position:relative; overflow:hidden; }
.mini-trilha span i { position:absolute; inset:0; width:var(--p,0%); background:var(--fc); transition:width .8s; border-radius:99px; }
.contadores { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
.contadores div { background:var(--card-2); border-radius:12px; padding:8px; text-align:center; }
.contadores b { display:block; font-size:20px; font-variant-numeric:tabular-nums; }
.contadores span { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }
.contadores b.pulo { animation: pulo .5s; color:var(--azul); }
@keyframes pulo { 40% { transform:scale(1.35); } }
.feed { display:flex; flex-direction:column; gap:10px; max-height:600px; overflow:hidden; }
.feed .ev { display:flex; gap:10px; align-items:flex-start; font-size:13px; animation: entra .5s; padding-bottom:10px; border-bottom:1px solid var(--borda); }
.feed .ev time { font-size:11px; color:var(--muted); display:block; }

/* ---------- Apresentação ---------- */
.slides-wrap { position:relative; border-radius:24px; overflow:hidden; aspect-ratio:16/9; background:#0d1030; color:#fff; box-shadow:var(--sombra-forte); }
.slides-wrap:fullscreen { border-radius:0; aspect-ratio:auto; }
.slide { position:absolute; inset:0; padding:6% 7%; display:flex; flex-direction:column; justify-content:center; opacity:0; transform:translateX(40px) scale(.98); transition: all .6s cubic-bezier(.2,.8,.2,1); pointer-events:none;
  background: radial-gradient(800px 500px at 100% 0%, rgba(236,47,143,.35), transparent 60%), radial-gradient(700px 500px at 0% 100%, rgba(63,184,238,.3), transparent 60%), linear-gradient(135deg,#13389a,#3d0a91); }
.slide.on { opacity:1; transform:none; pointer-events:auto; }
.slide.sai { opacity:0; transform:translateX(-40px) scale(.98); }
.slide .k { text-transform:uppercase; letter-spacing:2px; font-weight:700; font-size:clamp(10px,1.2vw,14px); opacity:.75; }
.slide h2 { font-size:clamp(22px,4vw,54px); margin:.2em 0; letter-spacing:-1px; line-height:1.05; }
.slide p { font-size:clamp(13px,1.6vw,20px); opacity:.9; max-width:80%; }
.slide .lista { display:flex; flex-direction:column; gap:1.2vh; margin-top:2vh; }
.slide .lista div { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18); border-radius:14px; padding:1.2vh 1.4vw; font-size:clamp(12px,1.5vw,19px); display:flex; gap:1vw; align-items:center; }
.slide .lista b.n { font-size:1.4em; min-width:2em; }
.slide .cols3 { display:grid; grid-template-columns:repeat(3,1fr); gap:1.4vw; margin-top:2vh; }
.slide .cols3 > div { border-radius:14px; padding:1.4vh 1vw; background:rgba(255,255,255,.08); }
.slide .cols3 h5 { margin:0 0 1vh; font-size:clamp(11px,1.3vw,16px); letter-spacing:1px; text-transform:uppercase; }
.slide .cols3 p { font-family:Caveat, cursive; font-size:clamp(13px,1.6vw,22px); margin:.4vh 0; max-width:none; }
.slides-nav { position:absolute; bottom:16px; left:0; right:0; display:flex; justify-content:center; gap:8px; z-index:5; }
.slides-nav i { width:9px; height:9px; border-radius:99px; background:rgba(255,255,255,.35); transition:.3s; cursor:pointer; }
.slides-nav i.on { width:28px; background:#fff; }
.slides-ctrl { position:absolute; right:16px; top:16px; z-index:5; display:flex; gap:8px; }
.slides-ctrl button { background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.25); border-radius:10px; padding:6px 10px; cursor:pointer; }

/* ---------- toast & confete ---------- */
#toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(120px); background:#1b1e2e; color:#fff; padding:12px 18px; border-radius:14px; box-shadow:var(--sombra-forte);
  transition: transform .45s cubic-bezier(.3,1.5,.5,1); z-index:200; display:flex; gap:10px; align-items:center; font-weight:600; }
#toast.on { transform:translateX(-50%) translateY(0); }
#confete { position:fixed; inset:0; pointer-events:none; z-index:150; }
.conquista { position:fixed; inset:0; display:grid; place-items:center; z-index:160; pointer-events:none; }
.conquista .medalha { background:var(--card); border-radius:28px; padding:28px 36px; text-align:center; box-shadow:var(--sombra-forte); animation: medalha 2.6s cubic-bezier(.3,1.5,.5,1) forwards; }
.conquista .medalha .ico { font-size:56px; }
.conquista .medalha h3 { margin:6px 0 2px; font-size:22px; }
@keyframes medalha { 0% { transform:scale(.3); opacity:0; } 15% { transform:scale(1); opacity:1; } 80% { transform:scale(1); opacity:1; } 100% { transform:scale(.9) translateY(-30px); opacity:0; } }


@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
@media (max-width: 900px) {
  .gut-grid, .sorteio, .painel { grid-template-columns:1fr; }
  .csd { grid-template-columns:1fr; }
  .quadros { grid-template-columns:1fr; }
  .hero { grid-template-columns:1fr; } .hero-dir { align-items:flex-start; }

  .fase .bola { width:46px; height:46px; } .fase .bola svg { width:20px; height:20px; } .trilha::before, .trilha .linha-prog { top:23px; }
  .fase .nome { font-size:9px; } .fase .sub { display:none; }
  header.top { padding:0 12px; gap:10px; } .logo span { display:none; }
}
@media (max-width: 560px) { .gut-escalas { grid-template-columns:1fr; } main { padding:16px 16px 60px; } .w { grid-template-columns:72px 1fr; } }

// "Time vivo" da demonstração: colegas fictícios fazem uma ação de cada vez, pelas APIs reais,
// para a sala do time, o painel e o feed se mexerem durante a apresentação.
function criarSimulador(S, mock, dados) {
  const FRASES = {
    gut: [
      ['Contrato não deixa claro o escopo da implantação', 4, 3, 4], ['Cliente troca o ponto focal no meio do projeto', 3, 3, 3],
      ['Ambiente de testes demora a ficar pronto', 4, 4, 3], ['Falta visibilidade do status para o cliente', 3, 4, 4],
    ],
    csd: [
      ['certeza', 'Clientes de varejo levam 20% mais tempo'], ['suposicao', 'Um portal de status reduziria ligações ao suporte'],
      ['duvida', 'Quantos clientes pedem customização?'], ['suposicao', 'Treinar o ponto focal antes do kickoff ajuda'],
      ['certeza', 'Implantações com checklist atrasam menos'], ['duvida', 'Qual etapa concentra mais retrabalho?'],
    ],
    plano: [
      { oQue: 'Montar checklist de kickoff', como: 'Oficina de 1h com a Implantação', onde: 'Sala de reuniões', quem: 'Coordenação' },
      { oQue: 'Pesquisa rápida com 5 clientes', como: 'Formulário de 3 perguntas', onde: 'E-mail', quem: 'Comercial' },
    ],
    ideias: [['Mapa da jornada do cliente na implantação', 'Linha do tempo visual compartilhada com o cliente.'], ['Padrinho de implantação', 'Um veterano acompanha cada consultor novo.']],
    apoios: ['Começar com um piloto de 2 clientes', 'Medir o tempo antes e depois', 'Usar o que já existe no CRM', 'Pedir feedback no 1º mês', 'Integrar com o portal do cliente', 'Envolver o suporte desde o início'],
  };
  const LIMITE = 25; // ações por time, para a demo não virar bagunça
  const contagem = {};
  const usadas = {};
  let timer = null;

  const proximo = (chave, lista) => {
    usadas[chave] = (usadas[chave] || 0) + 1;
    return lista[(usadas[chave] - 1) % lista.length];
  };

  function tick() {
    const antes = mock.estado.usuario;
    try {
      // a Aurora só ganha ideias de apoio (o quadro dela é o "oficial" da apresentação)
      const opcoes = dados.times.filter((t) => (contagem[t.id] || 0) < (t.id === dados.aurora ? 6 : LIMITE));
      if (!opcoes.length) return null;
      const t = opcoes[Math.floor(Math.random() * opcoes.length)];
      const quem = t.emails[Math.floor(Math.random() * t.emails.length)];
      mock.estado.usuario = quem;
      const s = S.api_time(t.id);
      const etapa = ['gut', 'csd', 'plano', 'ideias'].find((e) => !s.etapas[e].concluida) || 'ideias';
      const k = t.id;
      if (t.id === dados.aurora || (etapa === 'ideias' && s.ideias.length && Math.random() < 0.6)) {
        const ideia = s.ideias[Math.floor(Math.random() * s.ideias.length)];
        if (!ideia) return null;
        S.api_timeAcao(t.id, 'apoio.salvar', { ideiaId: ideia.id, texto: proximo(k + 'ap', FRASES.apoios) });
      } else if (etapa === 'gut') {
        const [texto, g, u, tt] = proximo(k + 'gut', FRASES.gut);
        S.api_timeAcao(t.id, 'gut.salvar', { texto, g, u, t: tt });
      } else if (etapa === 'csd') {
        const [coluna, texto] = proximo(k + 'csd', FRASES.csd);
        S.api_timeAcao(t.id, 'csd.salvar', { coluna, texto });
      } else if (etapa === 'plano') {
        S.api_timeAcao(t.id, 'plano.salvar', { ...proximo(k + 'pl', FRASES.plano) });
      } else {
        const [titulo, descricao] = proximo(k + 'id', FRASES.ideias);
        S.api_timeAcao(t.id, 'ideia.salvar', { titulo, descricao });
      }
      contagem[t.id] = (contagem[t.id] || 0) + 1;
      CacheService.getScriptCache().put(`on:${t.id}:${quem}`, '1', 120);
      return { time: t.nome, quem };
    } catch (e) {
      return null; // a demo nunca pode quebrar por causa do simulador
    } finally {
      mock.estado.usuario = antes;
    }
  }

  return {
    tick,
    ligado: () => !!timer,
    ligar(ms = 7000) { if (!timer) timer = setInterval(tick, ms); },
    desligar() { clearInterval(timer); timer = null; },
    total: () => Object.values(contagem).reduce((a, b) => a + b, 0),
  };
}

if (typeof module !== 'undefined' && module.exports) module.exports = { criarSimulador };

// Liga a demonstração: serviços simulados + servidor real (cópia em memória) + dados de exemplo.
// Nada daqui fala com a planilha real ou envia e-mail: tudo vive nesta aba do navegador.
var DEMO = null;

function __demoCriar() {

  const dados = semearDemo(S, mock);
  const sim = criarSimulador(S, mock, dados);
  DEMO = { S, mock, dados, sim };
  globalThis.__gsMock = (fn, args) => new Promise((res, rej) => setTimeout(() => {
    try {
      if (!/^api_/.test(fn) || typeof S[fn] !== 'function') throw new Error('Função indisponível na demonstração.');
      res(JSON.parse(JSON.stringify(S[fn].apply(null, args))));
    } catch (e) { rej(e); }
  }, 120));
  return DEMO;
}

function __demoComo(email) {
  DEMO.mock.estado.usuario = email;
  return DEMO.S.api_boot();
}

/** Chamado pelo app.html no lugar do BOOT do servidor quando a página abre com ?demo=1. */
function __demoBoot(bootServidor) {
  __demoCriar();
  const b = __demoComo(DEMO.dados.facilitador);
  return { ...b, demo: true, demoUrl: (bootServidor && bootServidor.demoUrl) || '' };
}

if (typeof module !== 'undefined' && module.exports) module.exports = { __demoCriar, __demoComo };

<script>
/* ============================== utilitários ============================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
let ME = BOOT.me; // "let": na demonstração dá para trocar de visão (facilitador ↔ participante)

/** google.script.run como Promise (na prévia local, usa o simulador). */
function gs(fn, ...args) {
  if (window.__gsMock) return window.__gsMock(fn, args);
  return new Promise((resolve, reject) =>
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args));
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}
const msgErro = (e) => (e && e.message ? e.message : String(e)).replace(/^Error:\s*/, '').replace(/^Exception:\s*/, '');

function toast(msg, erro) {
  const t = $('#toast');
  t.className = erro ? 'erro' : '';
  t.textContent = erro ? msgErro(msg) : msg;
  requestAnimationFrame(() => t.classList.add('on'));
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('on'), erro ? 5500 : 2400);
}

/** Executa uma chamada mostrando carregamento no botão e erro em toast. */
async function acao(btn, fn) {
  btn && btn.classList.add('carregando');
  try { return await fn(); }
  catch (e) { toast(e, true); throw e; }
  finally { btn && btn.classList.remove('carregando'); }
}

const ETAPAS = ['gut', 'csd', 'plano', 'ideias'];
const FASES = [
  { id: 'gut', nome: 'Definir', sub: 'Matriz GUT', cor: 'var(--f-empatizar)', ico: 'grid' },
  { id: 'csd', nome: 'Definir', sub: 'Matriz CSD', cor: 'var(--f-definir)', ico: 'lupa' },
  { id: 'plano', nome: 'Definir', sub: 'Plano de Ação', cor: 'var(--f-idear)', ico: 'mapa' },
  { id: 'ideias', nome: 'Idear', sub: 'Brainstorm', cor: 'var(--f-prototipar)', ico: 'luz' },
  { id: 'pitch', nome: 'Pitch', sub: 'Apresentação', cor: 'var(--f-testar)', ico: 'mic' },
];
const FASE = Object.fromEntries(FASES.map((f) => [f.id, f]));
const ICO = {
  grid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 17.5h7M17.5 14v7"/></svg>',
  lupa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.5-4.5M8 10.5h5"/></svg>',
  mapa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>',
  luz: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3Z"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
};

/**
 * Janela de confirmação/pergunta do próprio sistema (as nativas mostram o domínio do googleusercontent).
 * Resolve com true/false, ou com o texto digitado / null quando há `campo`.
 */
function dialogo({ titulo, texto = '', ok = 'Confirmar', perigo = false, campo = null, valor = '', html = '' }) {
  return new Promise((resolve) => {
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h2>${esc(titulo)}</h2>
      ${texto ? `<p class="muted" style="margin:0 0 8px">${esc(texto)}</p>` : ''}${html}
      ${campo !== null ? `<label class="campo">${esc(campo)}</label><input type="text" maxlength="160">` : ''}
      <div class="acoes-form"><button class="btn sec" data-r="nao">Cancelar</button><button class="btn${perigo ? ' perigo' : ''}" data-r="sim">${esc(ok)}</button></div></div>`;
    document.body.appendChild(bg);
    const inp = bg.querySelector('input[type=text]');
    if (inp) { inp.value = valor; inp.focus(); inp.select(); } else bg.querySelector('[data-r="sim"]').focus();
    const fechar = (r) => { bg.remove(); document.removeEventListener('keydown', tecla); resolve(r); };
    const sim = () => fechar(inp ? inp.value : true);
    const tecla = (ev) => {
      if (ev.key === 'Escape') fechar(inp ? null : false);
      if (ev.key === 'Enter' && (!inp || document.activeElement === inp)) { ev.preventDefault(); sim(); }
    };
    document.addEventListener('keydown', tecla);
    bg.querySelector('[data-r="nao"]').onclick = () => fechar(inp ? null : false);
    bg.querySelector('[data-r="sim"]').onclick = sim;
    bg.onclick = (ev) => { if (ev.target === bg) fechar(inp ? null : false); };
  });
}

/** Modal livre: devolve o elemento .modal e uma função para fechar. */
function modal(html, largura = 560) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" style="width:min(${largura}px,100%)">${html}</div>`;
  document.body.appendChild(bg);
  const fechar = () => { bg.remove(); document.removeEventListener('keydown', tecla); };
  const tecla = (ev) => { if (ev.key === 'Escape') fechar(); };
  document.addEventListener('keydown', tecla);
  bg.onclick = (ev) => { if (ev.target === bg) fechar(); };
  return { el: bg.querySelector('.modal'), fechar };
}

/* ============================== celebração ============================== */
function confete() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#confete'), x = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const cores = ['#ec2f8f', '#6a11b8', '#3b4fd8', '#1EAAFF', '#19FAFF', '#ffb000', '#41c463', '#ff6464'];
  const ps = Array.from({ length: 170 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 220, y: innerHeight * .35, vx: (Math.random() - .5) * 16, vy: -Math.random() * 14 - 4,
    r: Math.random() * 6 + 4, c: cores[Math.floor(Math.random() * cores.length)], a: Math.random() * 6, va: (Math.random() - .5) * .3 }));
  let t = 0;
  (function loop() {
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach((p) => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.globalAlpha = Math.max(0, 1 - t / 120); x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); });
    if (++t < 130) requestAnimationFrame(loop); else x.clearRect(0, 0, c.width, c.height);
  })();
}
function conquista(ico, titulo, sub) {
  const d = document.createElement('div');
  d.className = 'conquista';
  d.innerHTML = `<div class="medalha"><div class="ico">${ico}</div><h3>${esc(titulo)}</h3><div class="muted">${esc(sub)}</div></div>`;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 2700);
}
const espera = (ms) => new Promise((r) => setTimeout(r, ms));

/* ============================== tema ============================== */
$('#tema').onclick = () => {
  const r = document.documentElement;
  const escuro = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;

try { const t = localStorage.getItem('piv-tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

/* ============================== roteador ============================== */
// As rotas ficam no hash da página externa (script.google.com), via google.script.history/url.
const ROTAS = {};
let sair = null; // limpeza da tela atual (timers de atualização etc.)
function aoSair(fn) { sair = fn; }

function go(hash) {
  hash = '#' + String(hash).replace(/^#/, '');
  // na demonstração, mantém o ?demo=1 na URL para recarregar continuar na demo
  if (window.google && google.script && google.script.history) google.script.history.push(null, BOOT.demo ? { demo: '1' } : null, hash.slice(1));
  else history.pushState(null, '', hash);
  rotear(hash);
}

function rotear(hash) {
  const partes = String(hash || '').replace(/^#?\/?/, '').split('/');
  const nome = partes[0] || 'inicio';
  if (sair) { try { sair(); } catch (e) {} sair = null; }
  $$('#menu a').forEach((a) => a.classList.toggle('ativo', a.dataset.menu === (MENU_DE[nome] || nome)));
  const app = $('#app');
  app.innerHTML = '';
  scrollTo(0, 0);
  const tela = document.createElement('section');
  tela.className = 'view ativa';
  app.appendChild(tela);
  (ROTAS[nome] || ROTAS.inicio)(tela, partes[1], partes[2]);
}
const MENU_DE = { time: 'inicio', desafio: 'inicio', painel: 'inicio', apresentar: 'inicio' };

function carregando(el, txt = 'Carregando…') {
  el.innerHTML = `<div class="carregando-pag"><div class="roda"></div>${esc(txt)}</div>`;
}
function falha(el, e) {
  el.innerHTML = `<div class="card vazio"><div class="ico">😕</div><b>${esc(msgErro(e))}</b><p><a class="btn sec" data-go="/">Voltar ao início</a></p></div>`;
}

// links internos: <a data-go="/time/123">
document.addEventListener('click', (ev) => {
  const a = ev.target.closest('[data-go]');
  if (!a) return;
  ev.preventDefault();
  go(a.dataset.go);
});

/** Avatar e menu conforme quem está usando (refeito ao trocar de visão na demonstração). */
function montarCabecalho() {
  $('#eu').outerHTML = `<div class="av eu on" id="eu" style="--c:${corDe(ME.nome)}" title="${esc(ME.nome)} · ${esc(ME.email)}">${esc(ini(ME.nome))}</div>`;
  const itens = [['inicio', '/', 'Início'], ['historico', '/historico', 'Acervo de ideias']];
  if (ME.facilita) itens.push(['usuarios', '/usuarios', 'Pessoas']);
  $('#menu').innerHTML = itens.map(([k, h, t]) => `<a data-menu="${k}" data-go="${h}">${t}</a>`).join('');
  const demoBtn = $('#btn-demo');
  if (demoBtn) demoBtn.remove();
  if (!BOOT.demo && ME.admin && BOOT.demoUrl) {
    $('#tema').insertAdjacentHTML('beforebegin', '<button class="btn sec peq" id="btn-demo" title="Demonstração com dados fictícios">🎬 Demo</button>');
    $('#btn-demo').onclick = abrirJanelaDemo;
  }
}

/** Só o Admin: abrir a demonstração ou copiar o link para mostrar a qualquer pessoa da LTI. */
function abrirJanelaDemo() {
  const m = modal(`<h2>🎬 Modo demonstração</h2>
    <p class="muted">Uma cópia do Pivotando com tudo preenchido (times, matrizes, plano, ideias, painel e slides) e um roteiro guiado para apresentar.
      Roda só no navegador: <b>nada é gravado</b> e <b>nenhum e-mail é enviado</b>.</p>
    <p class="muted small">O link abre para qualquer conta @lti.net.br, mesmo quem não está cadastrado.</p>
    <label class="campo">Link da demonstração</label><input type="text" id="demo-link" readonly value="${esc(BOOT.demoUrl)}">
    <div class="acoes-form"><button class="btn sec" id="demo-copiar">📋 Copiar link</button><a class="btn grad" href="${esc(BOOT.demoUrl)}" target="_blank" rel="noopener">Abrir demonstração ↗</a></div>`);
  const inp = $('#demo-link', m.el);
  inp.onclick = () => inp.select();
  $('#demo-copiar', m.el).onclick = async () => {
    try { await navigator.clipboard.writeText(BOOT.demoUrl); toast('📋 Link copiado!'); }
    catch (e) { inp.focus(); inp.select(); try { document.execCommand('copy'); toast('📋 Link copiado!'); } catch (e2) { toast('Selecione o link e copie com Ctrl+C'); } }
  };
}

function iniciarApp() {
  montarCabecalho();
  if (BOOT.demo && window.__demoIniciarUI) __demoIniciarUI();
  if (window.google && google.script && google.script.history) {
    google.script.history.setChangeHandler((e) => rotear(e.location.hash));
    google.script.url.getLocation((loc) => rotear(loc.hash));
  } else {
    addEventListener('popstate', () => rotear(location.hash));
    rotear(location.hash);
  }
}
</script>

<script>
/* ============================== SALA DO TIME ============================== */
const ESC_GUT = {
  g: ['Sem gravidade', 'Pouco grave', 'Grave', 'Muito grave', 'Extremamente grave'],
  u: ['Pode esperar', 'Pouco urgente', 'O mais rápido possível', 'É urgente', 'Precisa ser resolvido já'],
  t: ['Não vai mudar nada', 'Piora em longo prazo', 'Piora em médio prazo', 'Piora em curto prazo', 'Piora rapidamente'],
};
const COLS_CSD = [['certeza', 'Certezas', 'o que já sabemos'], ['suposicao', 'Suposições', 'o que supomos, mas precisamos confirmar'], ['duvida', 'Dúvidas', 'o que precisamos descobrir']];
const WS = [['oQue', 'O quê?', 'Atividade a realizar'], ['como', 'Como?', 'De que forma'], ['onde', 'Onde?', 'Local, sistema ou área'], ['quando', 'Quando?', ''], ['quem', 'Quem?', 'Responsável']];
const QC = ['#ffb000', '#3b9ff0', '#5520c4', '#41c463', '#ec2f8f', '#103C9B', '#0d9488', '#ea580c'];
const CONQ = { gut: ['🎯', 'Problema na mira!', 'Matriz GUT concluída'], csd: ['🔍', 'Detetives da verdade', 'Matriz CSD concluída'], plano: ['🗺️', 'Rota traçada', 'Plano de Ação concluído'], ideias: ['💡', 'Fábrica de ideias', 'Brainstorm concluído'] };
const grauCor = (v) => (v >= 100 ? 'var(--g5)' : v >= 48 ? 'var(--g4)' : v >= 18 ? 'var(--g3)' : v >= 6 ? 'var(--g2)' : 'var(--g1)');
const grauNome = (v) => (v >= 100 ? 'Crítico' : v >= 48 ? 'Alto' : v >= 18 ? 'Médio' : 'Baixo');

let T = null; // estado da sala aberta

// #/time/<id> abre na etapa em andamento; #/time/<id>/<etapa> (ou /priorizar) abre direto nela
ROTAS.time = async (el, timeId, faseReq) => {
  carregando(el, 'Abrindo a sala do time…');
  let estado;
  try { estado = await gs('api_time', timeId); } catch (e) { return el.isConnected && falha(el, e); }
  if (!el.isConnected) return; // o usuário já foi para outra tela
  T = { id: timeId, s: estado, el, fase: null, pend: 0, adiado: false, modoIdeias: faseReq === 'priorizar' ? 'priorizar' : 'quadros', timers: [] };
  T.fase = faseInicial();
  const pedida = faseReq === 'priorizar' ? 'ideias' : faseReq;
  if (pedida && FASE[pedida] && faseLiberada(pedida)) T.fase = pedida;
  montarSala();
  T.timers.push(setInterval(tickPrazo, 1000));
  T.timers.push(setInterval(poll, 5000));
  aoSair(() => { T.timers.forEach(clearInterval); T = null; });
};

function faseInicial() {
  const e = T.s.etapas;
  return ETAPAS.find((k) => e[k].liberada && !e[k].concluida) || (ETAPAS.every((k) => e[k].concluida) ? 'pitch' : 'gut');
}
const faseLiberada = (f) => (f === 'pitch' ? T.s.etapas.ideias.concluida : T.s.etapas[f].liberada);

async function poll() {
  if (!T || document.hidden) return;
  const id = T.id;
  try {
    const r = await gs('api_timePoll', id, T.s.versao);
    if (!T || T.id !== id || T.pend) return;
    if (r.mudou) aplicar(r.estado);
    else { T.s.membros.forEach((m) => (m.online = r.online.includes(m.email))); desenharMembros(); }
  } catch (e) { /* rede instável: tenta de novo no próximo ciclo */ }
}

/** Aplica um estado novo do servidor sem atrapalhar quem está digitando. */
function aplicar(estado) {
  T.s = estado;
  if (editando()) { T.adiado = true; return; }
  T.adiado = false;
  desenharTudo();
}
function editando() {
  const a = document.activeElement;
  return a && T && T.el.contains(a) && (a.matches('input, textarea, select') || a.isContentEditable);
}
document.addEventListener('focusout', () => setTimeout(() => { if (T && T.adiado && !editando()) { T.adiado = false; desenharTudo(); } }, 50));

/** Envia uma ação do instrumento. Respostas só redesenham quando não há outras na fila. */
async function enviar(acaoNome, dados, { silencioso } = {}) {
  T.pend++;
  const id = T.id;
  try {
    const estado = await gs('api_timeAcao', id, acaoNome, dados);
    if (!T || T.id !== id) return null;
    T.pend--;
    if (!T.pend) aplicar(estado); else T.s.versao = estado.versao;
    return estado;
  } catch (e) {
    if (T && T.id === id) {
      T.pend--;
      toast(e, true);
      if (!T.pend && !silencioso) gs('api_time', id).then((s) => T && T.id === id && aplicar(s)).catch(() => {});
    }
    return null;
  }
}

/* ---------------------------- estrutura ---------------------------- */
function montarSala() {
  const s = T.s;
  T.el.innerHTML = `
    ${s.eu.facilita ? `<button class="voltar" data-go="/desafio/${esc(s.desafio.id)}">← Configuração do desafio</button>` : `<button class="voltar" data-go="/">← Meus desafios</button>`}
    <div class="card hero" style="--tc:${esc(s.time.cor)}">
      <div>
        <div class="kicker">Desafio #${esc(s.desafio.numero)} · <span style="display:inline-flex;align-items:center;gap:6px"><i style="width:10px;height:10px;border-radius:50%;background:${esc(s.time.cor)};display:inline-block;box-shadow:0 0 0 2px rgba(255,255,255,.5)"></i>Time ${esc(s.time.nome)}</span></div>
        <h1>${esc(s.desafio.titulo)}</h1>
        ${s.desafio.problema ? `<div class="problema">${esc(s.desafio.problema)}</div>` : ''}
        <div class="progresso"><div style="display:flex;justify-content:space-between;font-size:12px;opacity:.85;margin-bottom:6px"><span>Progresso do time</span><span id="pct">0%</span></div><div class="barra"><i id="barra"></i></div></div>
      </div>
      <div class="hero-dir">
        <div class="avs" id="avs-time"></div>
        <div style="font-size:12px;opacity:.85" id="prazo-label"></div>
        <div class="countdown" id="countdown"></div>
      </div>
    </div>
    <div class="trilha" id="trilha"><div class="linha-prog" id="linha-prog"></div></div>
    <div id="inst"></div>`;
  desenharTudo();
}

function desenharTudo() {
  if (!T) return;
  if (!faseLiberada(T.fase)) T.fase = faseInicial();
  desenharMembros();
  desenharTrilha();
  tickPrazo();
  desenharInst();
}

function desenharMembros() {
  const el = $('#avs-time');
  if (el) el.innerHTML = T.s.membros.map((m) => av(m.nome, m.online ? 'on' : '')).join('');
}

function desenharTrilha() {
  const tr = $('#trilha');
  tr.querySelectorAll('.fase').forEach((e) => e.remove());
  const e = T.s.etapas;
  FASES.forEach((f) => {
    const b = document.createElement('button');
    const lib = faseLiberada(f.id);
    const ok = f.id !== 'pitch' && e[f.id].concluida;
    b.className = 'fase' + (f.id === T.fase ? ' atual' : '') + (!lib ? ' bloq' : '');
    b.style.setProperty('--fc', f.cor);
    b.innerHTML = `<div class="bola">${ICO[f.ico]}${ok ? '<span class="selo">★</span>' : !lib ? '<span class="cadeado">🔒</span>' : ''}</div><div class="nome">${f.nome}</div><div class="sub">${f.sub}</div>`;
    b.onclick = () => {
      if (!lib) return toast('🔒 Conclua a etapa anterior para liberar');
      T.fase = f.id;
      desenharTrilha(); tickPrazo(); desenharInst();
    };
    tr.appendChild(b);
  });
  const n = ETAPAS.filter((k) => e[k].concluida).length;
  const pct = Math.round((n / ETAPAS.length) * 100);
  $('#linha-prog').style.width = (FASES.findIndex((f) => f.id === T.fase) / (FASES.length - 1)) * 88 + '%';
  requestAnimationFrame(() => { $('#barra').style.width = pct + '%'; });
  $('#pct').textContent = pct + '%';
}

function tickPrazo() {
  if (!T || !$('#countdown')) return;
  const pitch = T.fase === 'pitch';
  const data = pitch ? T.s.desafio.dataApresentacao : T.s.etapas[T.fase].prazo;
  const c = $('#countdown');
  if (!data) { $('#prazo-label').textContent = 'Sem prazo definido'; c.innerHTML = ''; return; }
  const fim = pitch ? Date.parse(data + 'T08:00:00-03:00') : fimDoPrazo(data);
  let s = Math.max(0, Math.floor((fim - Date.now()) / 1000));
  $('#prazo-label').textContent = (pitch ? 'Apresentação ao vivo · ' : 'Prazo · ' + FASE[T.fase].sub + ' · ') + fmtDia(data);
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  c.className = 'countdown' + (!pitch && s === 0 ? '' : d < 1 ? ' urgente' : d < 2 ? ' aviso' : '');
  c.innerHTML = s === 0 && !pitch ? '<div><b>⏰</b><span>encerrado</span></div>'
    : [[d, 'dias'], [h, 'horas'], [m, 'min'], [ss, 'seg']].map(([v, l]) => `<div><b>${String(v).padStart(2, '0')}</b><span>${l}</span></div>`).join('');
}

function desenharInst() {
  const el = $('#inst');
  if (!el) return;
  const f = T.fase;
  const info = f === 'pitch' ? null : T.s.etapas[f];
  el.onclick = el.onchange = el.oninput = el.ondblclick = null;
  el.className = 'inst ativo' + (info && !info.editavel ? ' ro' : '');
  let aviso = '';
  if (info && !info.editavel) {
    const d = T.s.desafio;
    aviso = d.status !== 'em_andamento' ? (d.status === 'rascunho' ? '⏳ O desafio ainda não começou.' : '🔒 O desafio não está mais em andamento: tudo está somente leitura.')
      : !T.s.eu.membro && !T.s.eu.facilita ? '👀 Você está vendo o trabalho de outro time.'
      : info.vencido ? `⏰ O prazo desta etapa terminou em ${fmtDia(info.prazo)}. Peça ao facilitador para reabrir se precisar.` : '';
  }
  const avisoHtml = aviso ? `<div class="aviso-etapa">${aviso}</div>` : '';
  ({ gut: desenharGUT, csd: desenharCSD, plano: desenharPlano, ideias: desenharIdeias, pitch: desenharPitch })[f](el, avisoHtml);
}

function rodapeEtapa(etapa, rotulo = 'Concluir etapa →') {
  const info = T.s.etapas[etapa];
  const prox = FASES[FASES.findIndex((f) => f.id === etapa) + 1];
  if (info.concluida) return `<div class="rodape-etapa"><span class="muted small">✓ Etapa concluída — vocês ainda podem ajustar até o prazo.</span><button class="btn sec" data-ir="${prox.id}">Ir para ${esc(prox.sub)} →</button></div>`;
  return `<div class="rodape-etapa so-edicao"><button class="btn grad" data-concluir="${etapa}">${rotulo}</button></div>`;
}
document.addEventListener('click', async (ev) => {
  if (!T) return;
  const ir = ev.target.closest('[data-ir]');
  if (ir) { T.fase = ir.dataset.ir; desenharTrilha(); tickPrazo(); desenharInst(); scrollTo({ top: 0, behavior: 'smooth' }); return; }
  const b = ev.target.closest('[data-concluir]');
  if (!b) return;
  const etapa = b.dataset.concluir;
  b.classList.add('carregando');
  const s = await enviar('etapa.concluir', { etapa }, { silencioso: true });
  b.classList.remove('carregando');
  if (!s) return;
  confete();
  conquista(...CONQ[etapa].slice(0, 2), CONQ[etapa][2] + ' · +1 selo para o time');
  setTimeout(() => { if (!T) return; T.fase = FASES[FASES.findIndex((f) => f.id === etapa) + 1].id; desenharTudo(); scrollTo({ top: 0, behavior: 'smooth' }); }, 900);
});

/* ---------------------------- GUT ---------------------------- */
function desenharGUT(el, aviso) {
  const ed = T.s.etapas.gut.editavel;
  el.innerHTML = `${aviso}
    <div class="inst-head"><h2>Matriz GUT</h2><span class="chip">Definir</span>
      <span class="muted">Liste os microproblemas do tema central e avalie Gravidade × Urgência × Tendência.</span></div>
    <div class="gut-grid">
      <div><div id="gut-lista"></div>
        <form class="novo-item so-edicao" id="gut-form"><input maxlength="300" placeholder="+ Novo microproblema… (Enter para adicionar)"></form>
        ${!T.s.gut.length ? '<div class="card vazio" style="margin-top:10px"><div class="ico">🧩</div>Nenhum microproblema ainda. Quais problemas menores compõem o problema central?</div>' : ''}
      </div>
      <div class="card mapa">
        <div style="display:flex;justify-content:space-between;align-items:center"><b>Mapa de calor</b><span class="small muted">Tamanho e cor = grau crítico</span></div>
        <svg id="mapa" viewBox="0 0 400 340"></svg>
        <div class="legenda-gut"><span>Grau crítico</span><i style="background:var(--g1)"></i>1<i style="background:var(--g2)"></i>8<i style="background:var(--g3)"></i>27<i style="background:var(--g4)"></i>64<i style="background:var(--g5)"></i>125</div>
      </div>
    </div>
    <div id="gut-aviso" class="muted small" style="text-align:right;margin-top:14px"></div>
    ${rodapeEtapa('gut')}`;
  listaGUT(false);
  $('#gut-form').onsubmit = (ev) => {
    ev.preventDefault();
    const i = ev.target.querySelector('input');
    const texto = i.value.trim();
    if (!texto) return;
    i.value = '';
    enviar('gut.salvar', { texto, g: 3, u: 3, t: 3 }).then((s) => s && toast('✅ Microproblema adicionado'));
  };
  const lista = $('#gut-lista');
  lista.onclick = (ev) => {
    if (!ed) return;
    const b = ev.target.closest('button');
    if (!b) return;
    const it = T.s.gut.find((x) => x.id === b.dataset.id);
    if (!it) return;
    if (b.dataset.coroa) { T.s.time.microproblemaId = it.id; listaGUT(false); enviar('gut.escolher', { id: it.id }).then((s) => s && toast('👑 Microproblema escolhido para a Matriz CSD')); return; }
    if (b.classList.contains('x')) {
      dialogo({ titulo: 'Remover microproblema?', texto: it.texto, ok: 'Remover', perigo: true }).then((ok) => ok && enviar('gut.remover', { id: it.id }));
      return;
    }
    it[b.dataset.k] = +b.dataset.v;
    it.grau = it.g * it.u * it.t;
    listaGUT(true);
    enviar('gut.salvar', { id: it.id, texto: it.texto, g: it.g, u: it.u, t: it.t });
  };
  lista.addEventListener('focusout', (ev) => {
    const tx = ev.target.closest('[data-texto]');
    if (!tx) return;
    const it = T.s.gut.find((x) => x.id === tx.dataset.texto);
    const novo = tx.textContent.trim();
    if (!it || !novo || novo === it.texto) { if (it) tx.textContent = it.texto; return; }
    it.texto = novo;
    enviar('gut.salvar', { id: it.id, texto: novo, g: it.g, u: it.u, t: it.t });
  });
  lista.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ev.target.matches('[data-texto]')) { ev.preventDefault(); ev.target.blur(); } });
  $('#mapa').onclick = (ev) => {
    const c = ev.target.closest('.bolha');
    if (!c) return;
    const card = $(`.gut-item[data-id="${c.dataset.id}"]`);
    if (!card) return;
    card.classList.add('destaque');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(() => card.classList.remove('destaque'), 1800);
  };
}

function listaGUT(animar) {
  const lista = $('#gut-lista');
  if (!lista) return;
  const ed = T.s.etapas.gut.editavel;
  const esc1 = T.s.time.microproblemaId;
  T.s.gut.sort((a, b) => b.grau - a.grau);
  const antes = {};
  lista.querySelectorAll('.gut-item').forEach((e) => (antes[e.dataset.id] = e.getBoundingClientRect().top));
  lista.innerHTML = T.s.gut.map((it, i) => {
    const escala = (k, rotulo) => `<div class="escala"><div class="rot">${rotulo}</div><div class="chips">${[1, 2, 3, 4, 5].map((v) =>
      `<button type="button" data-id="${it.id}" data-k="${k}" data-v="${v}" data-tip="${v} · ${ESC_GUT[k][v - 1]}" class="${it[k] === v ? 'on' : ''}" style="${it[k] === v ? `background:var(--g${v})` : ''}" ${ed ? '' : 'disabled'}>${v}</button>`).join('')}</div></div>`;
    const g = it.grau, eh = esc1 === it.id;
    return `<div class="gut-item ${eh ? 'escolhido' : ''}" data-id="${it.id}">
      <span class="rank">${i + 1}</span>
      <div><div class="txt">${eh ? '👑 ' : ''}<span data-texto="${it.id}" ${ed ? 'contenteditable="true" class="editavel"' : ''}>${esc(it.texto)}</span></div>
        <div class="small muted" style="display:flex;align-items:center;gap:6px;margin-top:4px">${av(it.autorNome, 'mini')} ${esc(primeiro(it.autorNome))}</div></div>
      <div class="grau"><b>${g}</b><span>grau crítico</span><div class="pill" style="background:${grauCor(g)};color:${g >= 100 ? '#fff' : '#1b1e2e'}">${grauNome(g)}</div></div>
      <div class="gut-escalas">${escala('g', 'Gravidade')}${escala('u', 'Urgência')}${escala('t', 'Tendência')}</div>
      ${ed ? `<button type="button" class="btn ${eh ? '' : 'sec'} peq coroa-btn" data-id="${it.id}" data-coroa="1">${eh ? '👑 Microproblema escolhido' : 'Levar este adiante'}</button>
        <button type="button" class="x" data-id="${it.id}" title="Remover">×</button>` : eh ? '<span class="coroa-btn small" style="font-weight:700;color:#b45309">👑 Microproblema escolhido</span>' : ''}
    </div>`;
  }).join('');
  if (animar) lista.querySelectorAll('.gut-item').forEach((e) => {
    const a = antes[e.dataset.id];
    if (a == null) return;
    const d = a - e.getBoundingClientRect().top;
    if (d) e.animate([{ transform: `translateY(${d}px)` }, { transform: 'none' }], { duration: 500, easing: 'cubic-bezier(.2,.8,.2,1)' });
  });
  desenharMapa();
  const av1 = $('#gut-aviso');
  if (av1) av1.textContent = T.s.gut.length && !esc1 && ed ? '👑 Escolha o microproblema que o time vai levar adiante para concluir.' : '';
}

function desenharMapa() {
  const svg = $('#mapa');
  if (!svg) return;
  const W = 400, H = 340, P = 44, x = (v) => P + ((v - 0.5) * (W - P - 14)) / 5, y = (v) => H - P - ((v - 0.5) * (H - P - 14)) / 5;
  let s = `<defs><linearGradient id="fundo-mapa" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="var(--g1)" stop-opacity=".25"/><stop offset=".6" stop-color="var(--g4)" stop-opacity=".18"/><stop offset="1" stop-color="var(--g5)" stop-opacity=".3"/></linearGradient></defs>`;
  s += `<rect x="${P}" y="14" width="${W - P - 14}" height="${H - P - 14}" rx="10" fill="url(#fundo-mapa)"/>`;
  for (let v = 1; v <= 5; v++) {
    s += `<line x1="${x(v)}" y1="14" x2="${x(v)}" y2="${H - P}" stroke="var(--borda)" stroke-dasharray="3 4"/><line x1="${P}" y1="${y(v)}" x2="${W - 14}" y2="${y(v)}" stroke="var(--borda)" stroke-dasharray="3 4"/>`;
    s += `<text x="${x(v)}" y="${H - P + 16}" font-size="11" text-anchor="middle" fill="var(--muted)">${v}</text><text x="${P - 10}" y="${y(v) + 4}" font-size="11" text-anchor="end" fill="var(--muted)">${v}</text>`;
  }
  s += `<text x="${(W + P) / 2}" y="${H - 6}" font-size="11" font-weight="700" text-anchor="middle" fill="var(--muted)">GRAVIDADE →</text><text x="12" y="${(H - P) / 2}" font-size="11" font-weight="700" text-anchor="middle" fill="var(--muted)" transform="rotate(-90 12 ${(H - P) / 2})">URGÊNCIA →</text>`;
  const pos = {};
  const esc1 = T.s.time.microproblemaId;
  [...T.s.gut].sort((a, b) => a.grau - b.grau).forEach((it) => {
    const k = it.g + '-' + it.u;
    pos[k] = (pos[k] || 0) + 1;
    const off = (pos[k] - 1) * 9, g = it.grau, r = 8 + Math.sqrt(g) * 2.2, cx = x(it.g) + off, cy = y(it.u) - off;
    s += `<g><circle class="bolha" data-id="${it.id}" cx="${cx}" cy="${cy}" r="${r}" fill="${grauCor(g)}" stroke="${esc1 === it.id ? '#f59e0b' : 'rgba(0,0,0,.25)'}" stroke-width="${esc1 === it.id ? 3 : 1}" fill-opacity=".9"><title>${esc(it.texto)} — ${g}</title></circle>`;
    s += `<text x="${cx}" y="${cy + 4}" font-size="11" font-weight="800" text-anchor="middle" fill="${g >= 100 ? '#fff' : '#1b1e2e'}" pointer-events="none">${g}</text>`;
    if (esc1 === it.id) s += `<text x="${cx}" y="${cy - r - 3}" font-size="16" text-anchor="middle" pointer-events="none">👑</text>`;
    s += '</g>';
  });
  svg.innerHTML = s;
}

/* ---------------------------- CSD ---------------------------- */
function desenharCSD(el, aviso) {
  const ed = T.s.etapas.csd.editavel;
  const micro = T.s.gut.find((g) => g.id === T.s.time.microproblemaId);
  el.innerHTML = `${aviso}
    <div class="inst-head"><h2>Matriz CSD</h2><span class="chip">Definir</span><span class="muted">${ed ? 'Arraste os post-its entre as colunas. Dois cliques para editar. Marque "→ Plano" no que precisa virar ação.' : ''}</span></div>
    <div class="foco"><span style="font-size:24px">👑</span><div><div class="k">Microproblema escolhido</div><b>${esc(micro ? micro.texto : '—')}</b></div></div>
    <div class="csd">${COLS_CSD.map(([k, t, s]) => {
      const cards = T.s.csd.filter((c) => c.coluna === k);
      return `<div class="coluna" style="--cc:var(--c-${k})"><div class="coluna-head"><h3>${t}<span>${cards.length}</span></h3><p>${s}</p></div>
        <div class="notas" data-col="${k}">${cards.map((c) => notaCSD(c, ed)).join('')}</div>
        <form class="add-nota so-edicao" data-col="${k}"><input maxlength="300" placeholder="+ Novo post-it"></form></div>`;
    }).join('')}</div>
    ${rodapeEtapa('csd')}`;
  if (ed) $$('.notas', el).forEach((n) => Sortable.create(n, { group: 'csd', animation: 220, ghostClass: 'sortable-ghost', filter: '.x, .plano-btn', preventOnFilter: false, onEnd: moverCSD }));
  $$('.add-nota', el).forEach((f) => (f.onsubmit = (ev) => {
    ev.preventDefault();
    const i = f.querySelector('input');
    const texto = i.value.trim();
    if (!texto) return;
    i.value = '';
    enviar('csd.salvar', { coluna: f.dataset.col, texto });
  }));
  const csd = $('.csd', el);
  csd.onclick = (ev) => {
    if (!ed) return;
    const n = ev.target.closest('.nota');
    if (!n) return;
    const c = T.s.csd.find((x) => x.id === n.dataset.id);
    if (ev.target.closest('.plano-btn')) {
      c.plano = !c.plano;
      ev.target.closest('.plano-btn').classList.toggle('on', c.plano);
      if (c.plano) { n.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.08) rotate(3deg)' }, { transform: 'scale(1)' }], { duration: 400 }); toast('🗺️ Enviado para o Plano de Ação'); }
      enviar('csd.plano', { id: c.id, plano: c.plano });
    } else if (ev.target.closest('.x')) {
      dialogo({ titulo: 'Remover post-it?', texto: c.texto, ok: 'Remover', perigo: true }).then((ok) => ok && enviar('csd.remover', { id: c.id }));
    }
  };
  csd.ondblclick = async (ev) => {
    if (!ed) return;
    const n = ev.target.closest('.nota');
    if (!n) return;
    const c = T.s.csd.find((x) => x.id === n.dataset.id);
    const novo = await dialogo({ titulo: 'Editar post-it', campo: 'Texto', valor: c.texto, ok: 'Salvar' });
    if (novo && novo.trim() && novo.trim() !== c.texto) enviar('csd.salvar', { id: c.id, texto: novo.trim() });
  };
}
function notaCSD(c, ed) {
  return `<div class="nota" data-id="${c.id}" style="--nc:var(--n-${c.coluna});--rot:${rot()}">${esc(c.texto)}
    <div class="rodape"><span style="display:flex;gap:6px;align-items:center">${av(c.autorNome, 'mini')}${esc(primeiro(c.autorNome))}</span>
    ${c.coluna !== 'certeza' ? (ed ? `<button class="plano-btn ${c.plano ? 'on' : ''}" type="button">→ Plano</button>` : c.plano ? '<span class="plano-btn on">→ Plano</span>' : '') : ''}</div>
    ${ed ? '<button class="x" type="button" title="Remover">×</button>' : ''}</div>`;
}
function moverCSD() {
  const colunas = {};
  COLS_CSD.forEach(([k]) => (colunas[k] = $$(`.notas[data-col="${k}"] .nota`).map((n) => n.dataset.id)));
  for (const [k, ids] of Object.entries(colunas)) ids.forEach((id) => { const c = T.s.csd.find((x) => x.id === id); if (c) { c.coluna = k; if (k === 'certeza') c.plano = false; } });
  T.s.csd.sort((a, b) => colunas[a.coluna].indexOf(a.id) - colunas[b.coluna].indexOf(b.id));
  enviar('csd.mover', { colunas });
  desenharInst();
}

/* ---------------------------- PLANO ---------------------------- */
function desenharPlano(el, aviso) {
  const ed = T.s.etapas.plano.editavel;
  const marcados = T.s.csd.filter((c) => c.plano);
  const itens = marcados.map((card) => ({ card, a: T.s.plano.find((p) => p.csdCardId === card.id) || null }));
  T.s.plano.filter((p) => !marcados.some((c) => c.id === p.csdCardId)).forEach((a) => itens.push({ card: T.s.csd.find((c) => c.id === a.csdCardId) || null, a }));
  const rotulo = { suposicao: 'Suposição', duvida: 'Dúvida', certeza: 'Certeza' };
  el.innerHTML = `${aviso}
    <div class="inst-head"><h2>Plano de Ação</h2><span class="chip">Definir</span><span class="muted">Cada suposição ou dúvida marcada na CSD vira uma ação.</span><span class="espaco"></span>
      <button class="btn sec peq so-edicao" id="add-plano">+ Ação avulsa</button></div>
    <datalist id="dl-membros">${T.s.membros.map((m) => `<option value="${esc(m.nome)}">`).join('')}</datalist>
    <div class="planos">${itens.length ? itens.map(({ card, a }) => `<div class="plano" data-card="${card ? card.id : ''}" data-id="${a ? a.id : ''}">
      <div class="origem"><span class="tag" style="background:${card ? `var(--c-${card.coluna})` : 'var(--muted)'}">${card ? rotulo[card.coluna] : 'Avulsa'}</span><span>${esc(card ? card.texto : 'Ação proposta pelo time')}</span></div>
      ${WS.map(([k, l, ph]) => `<div class="w" style="--wc:var(--p-${k.toLowerCase()})"><div class="k">${l}</div>${ed
        ? k === 'quando' ? `<input type="date" data-campo="${k}" value="${esc(a ? a[k] : '')}">`
        : k === 'quem' ? `<input list="dl-membros" data-campo="${k}" maxlength="200" placeholder="${ph}…" value="${esc(a ? a[k] : '')}">`
        : `<textarea rows="1" data-campo="${k}" maxlength="500" placeholder="${ph}…">${esc(a ? a[k] : '')}</textarea>`
        : `<div class="v-ro">${esc(a ? (k === 'quando' ? fmtDia(a[k]) : a[k]) || '—' : '—')}</div>`}</div>`).join('')}
      ${ed && a && !card ? '<button class="x" title="Remover">×</button>' : ''}
    </div>`).join('') : '<div class="card vazio"><div class="ico">🗺️</div>Nenhum post-it marcado com "→ Plano" na Matriz CSD.<br>Volte à CSD e marque as suposições e dúvidas que precisam virar ação.</div>'}</div>
    ${rodapeEtapa('plano')}`;
  const ajustar = (t) => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; };
  $$('.planos textarea', el).forEach(ajustar);
  el.oninput = (ev) => ev.target.matches('textarea') && ajustar(ev.target);
  el.onchange = (ev) => {
    const inp = ev.target.closest('[data-campo]');
    if (!inp) return;
    const card = inp.closest('.plano');
    const dados = { [inp.dataset.campo]: inp.value };
    if (card.dataset.id) dados.id = card.dataset.id; else if (card.dataset.card) dados.csdCardId = card.dataset.card;
    enviar('plano.salvar', dados).then((s) => {
      if (!s) return;
      const salvo = s.plano.find((p) => (dados.id ? p.id === dados.id : p.csdCardId === dados.csdCardId));
      if (salvo && card.isConnected) card.dataset.id = salvo.id;
    });
  };
  const add = $('#add-plano', el);
  if (add) add.onclick = () => enviar('plano.salvar', { oQue: '' }).then((s) => s && toast('➕ Ação avulsa criada'));
  el.onclick = (ev) => {
    const x = ev.target.closest('.plano .x');
    if (x) dialogo({ titulo: 'Remover esta ação?', ok: 'Remover', perigo: true }).then((ok) => ok && enviar('plano.remover', { id: x.closest('.plano').dataset.id }));
  };
}
