    return;
  }
  $$('.apoios', el).forEach((a) => Sortable.create(a, { group: 'apoios', animation: 220, ghostClass: 'sortable-ghost', filter: '.x', preventOnFilter: false,
    onAdd: (ev) => enviar('apoio.mover', { id: ev.item.dataset.apoio, ideiaId: ev.to.dataset.id }) }));
  $$('.quadro .add-nota', el).forEach((f) => (f.onsubmit = (ev) => {
    ev.preventDefault();
    const i = f.querySelector('input');
    const texto = i.value.trim();
    if (!texto) return;
    i.value = '';
    enviar('apoio.salvar', { ideiaId: f.dataset.id, texto });
  }));
  $('#nova-ideia', el).onsubmit = (ev) => {
    ev.preventDefault();
    const f = ev.target;
    const titulo = f.titulo.value.trim();
    if (!titulo) return;
    enviar('ideia.salvar', { titulo, descricao: f.descricao.value.trim() }).then((s) => s && toast('💡 Ideia adicionada'));
    f.reset();
  };
  el.onclick = async (ev) => {
    const x = ev.target.closest('.x');
    if (x && x.closest('[data-apoio]')) { enviar('apoio.remover', { id: x.closest('[data-apoio]').dataset.apoio }); return; }
    if (x && x.hasAttribute('data-rem-ideia')) {
      const q = x.closest('.quadro');
      if (await dialogo({ titulo: 'Remover esta ideia e os apoios dela?', ok: 'Remover', perigo: true })) enviar('ideia.remover', { id: q.dataset.id });
    }
  };
  el.ondblclick = async (ev) => {
    const p = ev.target.closest('.principal');
    if (!p) return;
    const it = T.s.ideias.find((x) => x.id === p.closest('.quadro').dataset.id);
    const novo = await dialogo({ titulo: 'Editar título da ideia', campo: 'Título', valor: it.titulo, ok: 'Salvar' });
    if (novo && novo.trim()) enviar('ideia.salvar', { id: it.id, titulo: novo.trim(), descricao: it.descricao });
  };
}

/* ---------------------------- PITCH ---------------------------- */
function desenharPitch(el) {
  el.onclick = el.onchange = el.oninput = el.ondblclick = null;
  const top = T.s.ideias[0];
  el.innerHTML = `<div class="card" style="text-align:center;padding:48px 20px">
    <div style="font-size:54px">🎤</div>
    <h2 style="margin:8px 0">Tudo pronto para o pitch!</h2>
    <p class="muted">O resumo do Time ${esc(T.s.time.nome)} já está montado em slides para apresentar ao vivo${T.s.desafio.dataApresentacao ? ` em <b>${fmtDia(T.s.desafio.dataApresentacao)}</b>` : ''}.</p>
    ${top ? `<p style="margin:18px auto;max-width:560px">🥇 Ideia principal do time: <b>${esc(top.titulo)}</b></p>` : ''}
    <a class="btn grad" data-go="/apresentar/${esc(T.id)}">Abrir modo apresentação →</a></div>`;
}
</script>

<script>
/* ============================== INÍCIO ============================== */
ROTAS.inicio = async (el) => {
  carregando(el);
  let ini;
  try { ini = await gs('api_inicio'); } catch (e) { return el.isConnected && falha(el, e); }
  if (!el.isConnected) return; // o usuário já foi para outra tela
  const hora = new Date().getHours();
  const saud = hora < 12 ? 'Bom dia' : hora < 18 ? 'Boa tarde' : 'Boa noite';
  const cardMeu = ({ desafio: d, time: t }) => {
    const n = t ? t.concluidas.length : 0;
    return `<div class="card dcard" style="--tc:${t ? esc(t.cor) : 'var(--borda)'}">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="num">Desafio #${esc(d.numero)}</span>${statusTag(d.status)}</div>
      <h3>${esc(d.titulo)}</h3>
      ${t ? `<div style="display:flex;align-items:center;gap:8px"><i style="width:12px;height:12px;border-radius:50%;background:${esc(t.cor)}"></i><b>Time ${esc(t.nome)}</b>
          <span class="muted small">· ${t.etapaAtual === 'pitch' ? 'pronto para o pitch 🎤' : 'etapa atual: ' + esc(FASE[t.etapaAtual].sub)}</span></div>
        <div class="mini-trilha">${FASES.slice(0, 4).map((f, k) => `<span style="--fc:${f.cor}"><i style="--p:${k < n ? 100 : 0}%"></i></span>`).join('')}</div>` : '<span class="muted">Você ainda não está em um time.</span>'}
      <div class="rod">${t ? `<a class="btn" data-go="/time/${esc(t.id)}">Entrar na sala do time →</a>` : ''}</div></div>`;
  };
  const cardGestao = (d) => `<div class="card dcard">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="num">Desafio #${esc(d.numero)}</span>${statusTag(d.status)}</div>
      <h3>${esc(d.titulo)}</h3>
      <div class="muted small">${d.participantes} participante(s) · ${d.times.length} time(s)${d.prazoIdeias ? ' · brainstorm até ' + fmtDia(d.prazoIdeias) : ''}</div>
      ${d.times.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap">${d.times.map((t) => `<span class="dep" style="--dc:${esc(t.cor)}">${esc(t.nome)} · ${t.concluidas.length}/4</span>`).join('')}</div>` : ''}
      <div class="rod"><a class="btn sec peq" data-go="/desafio/${esc(d.id)}">⚙️ Configurar</a>${d.status !== 'rascunho' ? `<a class="btn peq" data-go="/painel/${esc(d.id)}">📡 Painel ao vivo</a>` : ''}</div></div>`;
  el.innerHTML = `
    <div class="card hero boas-vindas">
      <div><div class="kicker">Pivotando · Juntos, viramos o jogo.</div><h1>${saud}, ${esc(primeiro(ME.nome))}! 👋</h1>
        <div class="problema">Problemas reais, times misturados e ideias que viram o jogo. ${ini.meus.length ? 'Escolha um desafio para continuar.' : ''}</div></div>
      <div class="hero-dir">${ME.facilita ? '<button class="btn grad" data-go="/desafio/novo">+ Novo desafio</button>' : ''}</div>
    </div>
    <div class="secao"><h3>Meus desafios</h3>
      ${ini.meus.length ? `<div class="grade">${ini.meus.map(cardMeu).join('')}</div>`
        : '<div class="card vazio"><div class="ico">🚀</div>Você ainda não participa de nenhum desafio em andamento.<br>Quando for sorteado para um time, o convite chega no seu e-mail.</div>'}</div>
    ${ME.facilita ? `<div class="secao"><h3>Gestão de desafios</h3>
      ${ini.gestao.length ? `<div class="grade">${ini.gestao.map(cardGestao).join('')}</div>`
        : '<div class="card vazio"><div class="ico">🧭</div>Nenhum desafio criado ainda.<br><br><button class="btn grad" data-go="/desafio/novo">Criar o primeiro desafio</button></div>'}</div>` : ''}`;
};

/* ============================== DESAFIO (facilitador) ============================== */
let D = null;
const PASSOS = [['dados', 'Problema e prazos'], ['participantes', 'Participantes'], ['times', 'Times'], ['andamento', 'Andamento']];

ROTAS.desafio = async (el, id, passo) => {
  if (!ME.facilita) return falha(el, 'Apenas facilitadores acessam esta tela.');
  if (id === 'novo') {
    D = { el, novo: true, passo: 'dados', d: { desafio: { titulo: '', problema: '', descricao: '', tamanhoTime: 5, status: 'rascunho' }, participantes: [], times: [], usuarios: [] } };
    return desenharDesafio();
  }
  carregando(el);
  let dd;
  try { dd = await gs('api_desafio', id); } catch (e) { return el.isConnected && falha(el, e); }
  if (!el.isConnected) return; // o usuário já foi para outra tela
  D = { el, d: dd };
  const d = D.d;
  D.passo = d.desafio.status !== 'rascunho' ? 'andamento' : !d.participantes.length ? 'participantes' : !d.times.length ? 'times' : 'andamento';
  if (PASSOS.some(([k]) => k === passo)) D.passo = passo;
  desenharDesafio();
  aoSair(() => { D = null; });
};

function desenharDesafio() {
  const { d } = D;
  const feito = { dados: !D.novo, participantes: d.participantes.length > 0, times: d.times.length > 0, andamento: d.desafio.status !== 'rascunho' };
  D.el.innerHTML = `<button class="voltar" data-go="/">← Início</button>
    <div class="cab-pag"><div><div class="muted small" style="font-weight:700;letter-spacing:1px;text-transform:uppercase">${D.novo ? 'Novo desafio' : 'Desafio #' + esc(d.desafio.numero)}</div>
      <h1 class="pag">${esc(d.desafio.titulo || 'Qual é o problema central?')}</h1></div><span class="espaco"></span>${D.novo ? '' : statusTag(d.desafio.status)}</div>
    <div class="passos">${PASSOS.map(([k, t], i) => `<div class="passo ${D.passo === k ? 'on' : ''} ${feito[k] ? 'feito' : ''}" data-passo="${k}"><b>${feito[k] && D.passo !== k ? '✓' : i + 1}</b>${t}</div>`).join('')}</div>
    <div id="passo"></div>`;
  $$('.passo', D.el).forEach((p) => (p.onclick = () => {
    if (D.novo && p.dataset.passo !== 'dados') return toast('Salve o problema e os prazos primeiro.');
    D.passo = p.dataset.passo; desenharDesafio();
  }));
  ({ dados: passoDados, participantes: passoParticipantes, times: passoTimes, andamento: passoAndamento })[D.passo]($('#passo'));
}

function passoDados(el) {
  const x = D.d.desafio;
  const ro = x.status === 'encerrado';
  el.innerHTML = `<form class="card" id="f-dados">
    <label class="campo">Problema central <small>— escreva como uma pergunta desafiadora</small></label>
    <input type="text" name="titulo" maxlength="160" required placeholder="Ex.: Como reduzir o tempo de implantação de novos clientes?" value="${esc(x.titulo)}">
    <label class="campo">Contexto do problema <small>— o que está acontecendo hoje</small></label>
    <textarea name="problema" maxlength="1000" rows="3" placeholder="Dados, sintomas, impacto…">${esc(x.problema)}</textarea>
    <label class="campo">Orientações para os times <small>(opcional)</small></label>
    <textarea name="descricao" maxlength="3000" rows="3" placeholder="Regras, materiais de apoio, quem procurar…">${esc(x.descricao)}</textarea>
    <div class="cols3"><div><label class="campo">Pessoas por time</label><input type="number" name="tamanhoTime" min="2" max="12" value="${esc(x.tamanhoTime || 5)}"></div></div>
    <div class="secao"><h3>Prazos de entrega</h3>
      <div class="cols5">
        ${[['prazoGut', '🎯 Matriz GUT'], ['prazoCsd', '🔍 Matriz CSD'], ['prazoPlano', '🗺️ Plano de Ação'], ['prazoIdeias', '💡 Brainstorm'], ['dataApresentacao', '🎤 Apresentação']]
          .map(([k, t]) => `<div><label class="campo">${t}</label><input type="date" name="${k}" value="${esc(x[k] || '')}"></div>`).join('')}
      </div>
      <p class="muted small">Cada etapa fica aberta até o fim do dia do prazo (horário de Brasília). Na véspera, quem ainda não concluiu recebe um lembrete por e-mail.</p></div>
    ${ro ? '' : `<div class="acoes-form"><button class="btn">${D.novo ? 'Criar desafio →' : 'Salvar'}</button></div>`}</form>`;
  if (ro) $$('input, textarea', el).forEach((i) => (i.disabled = true));
  $('#f-dados').onsubmit = async (ev) => {
    ev.preventDefault();
    const f = ev.target;
    const dados = Object.fromEntries(new FormData(f).entries());
    const ordem = ['prazoGut', 'prazoCsd', 'prazoPlano', 'prazoIdeias', 'dataApresentacao'].map((k) => dados[k]).filter(Boolean);
    if (ordem.some((v, i) => i && v < ordem[i - 1])) return toast('Os prazos precisam seguir a ordem das etapas.', true);
    if (!D.novo) dados.id = D.d.desafio.id;
    const r = await acao(f.querySelector('button'), () => gs('api_desafioSalvar', dados));
    toast('✅ Desafio salvo');
    if (D.novo) return go('/desafio/' + r.desafio.id);
    D.d = r; D.passo = r.participantes.length ? D.passo : 'participantes'; desenharDesafio();
  };
}

function passoParticipantes(el) {
  const { d } = D;
  const sel = new Set(d.participantes.map((p) => p.email));
  const deps = [...new Set(d.usuarios.map((u) => u.departamento || 'Sem departamento'))].sort();
  let filtroDep = '', busca = '';
  const ro = d.desafio.status === 'encerrado';
  el.innerHTML = `<div class="card">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b style="font-size:16px"><span id="n-sel">${sel.size}</span> selecionado(s)</b><span class="espaco" style="flex:1"></span>
      <input class="inp" id="busca-p" placeholder="🔎 Buscar por nome, e-mail ou função" style="max-width:300px">
      <button class="btn sec peq" id="marcar">Marcar visíveis</button><button class="btn sec peq" id="desmarcar">Desmarcar visíveis</button></div>
    <div class="filtros" id="f-deps"><button class="filtro on" data-dep="">Todos</button>${deps.map((dp) => `<button class="filtro" data-dep="${esc(dp)}" style="--dc:${corDe(dp)}">${esc(dp)}</button>`).join('')}</div>
    <div class="selecao" id="lista-p"></div>
    ${!d.usuarios.length ? '<div class="vazio">Nenhuma pessoa cadastrada ainda. <a class="btn sec peq" data-go="/usuarios">Cadastrar pessoas</a></div>' : ''}
    <div class="acoes-form"><a class="btn sec" data-go="/usuarios">+ Cadastrar pessoas</a>${ro ? '' : '<button class="btn" id="salvar-p">Salvar participantes →</button>'}</div></div>`;
  const visiveis = () => d.usuarios.filter((u) => (!filtroDep || (u.departamento || 'Sem departamento') === filtroDep)
    && (!busca || `${u.nome} ${u.email} ${u.funcao}`.toLowerCase().includes(busca)));
  const desenhar = () => {
    $('#lista-p').innerHTML = visiveis().map((u) => `<label class="sel-pessoa ${sel.has(u.email) ? 'on' : ''}"><input type="checkbox" value="${esc(u.email)}" ${sel.has(u.email) ? 'checked' : ''} ${ro ? 'disabled' : ''}>
      ${av(u.nome)}<div style="flex:1;min-width:0"><b>${esc(u.nome)}</b><div class="small muted">${esc(u.funcao || '—')} · ${esc(u.email)}</div></div>
      <span class="dep" style="--dc:${corDe(u.departamento || 'Sem departamento')}">${esc(u.departamento || 'Sem departamento')}</span></label>`).join('');
    $('#n-sel').textContent = sel.size;
  };
  desenhar();
  $('#lista-p').onchange = (ev) => { if (ev.target.checked) sel.add(ev.target.value); else sel.delete(ev.target.value); ev.target.closest('.sel-pessoa').classList.toggle('on', ev.target.checked); $('#n-sel').textContent = sel.size; };
  $('#busca-p').oninput = (ev) => { busca = ev.target.value.trim().toLowerCase(); desenhar(); };
  $('#f-deps').onclick = (ev) => { const b = ev.target.closest('.filtro'); if (!b) return; filtroDep = b.dataset.dep; $$('.filtro', el).forEach((x) => x.classList.toggle('on', x === b)); desenhar(); };
  $('#marcar').onclick = () => { if (!ro) { visiveis().forEach((u) => sel.add(u.email)); desenhar(); } };
  $('#desmarcar').onclick = () => { if (!ro) { visiveis().forEach((u) => sel.delete(u.email)); desenhar(); } };
  const salvar = $('#salvar-p');
  if (salvar) salvar.onclick = async () => {
    D.d = await acao(salvar, () => gs('api_participantesDefinir', d.desafio.id, [...sel]));
    D.rascunhoTimes = null;
    toast('✅ Participantes salvos');
    D.passo = 'times'; desenharDesafio();
  };
}

/* ---------- times: sorteio animado + ajuste manual por arrastar ---------- */
function passoTimes(el) {
  const { d } = D;
  const rasc = d.desafio.status === 'rascunho';
  const ro = d.desafio.status === 'encerrado';
  const n = d.participantes.length;
  const sugestao = Math.max(1, Math.ceil(n / (d.desafio.tamanhoTime || 5)));
  D.rascunhoTimes = D.rascunhoTimes || d.times.map((t) => ({ id: t.id, nome: t.nome, cor: t.cor, emails: [...t.emails] }));
  el.innerHTML = `
    ${rasc ? `<div class="card" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:16px">
      <div><b>${n} participante(s)</b><div class="muted small">O sorteio equilibra o tamanho dos times e mistura departamentos e funções.</div></div><span style="flex:1"></span>
      <label class="small muted">Quantos times? <select id="qtd" class="inp" style="width:auto;display:inline-block;padding:6px 10px">${Array.from({ length: Math.max(1, Math.min(12, n)) }, (_, i) => i + 1).map((k) => `<option ${k === sugestao ? 'selected' : ''}>${k}</option>`).join('')}</select></label>
      <button class="btn grad" id="sortear" ${n < 2 ? 'disabled' : ''}>🎲 ${d.times.length ? 'Sortear de novo' : 'Sortear times'}</button></div>` : ''}
    <div class="sorteio" style="grid-template-columns:1fr">
      <div class="palco">
        <div class="slot" id="slot" style="${D.rascunhoTimes.length && !D.animando ? 'display:none' : ''}"><div class="nome-slot">${n < 2 ? 'Selecione os participantes primeiro' : 'Pronto para sortear?'}<small>Projete esta tela no encontro 🎉</small></div></div>
        <div class="times-grid" id="times-grid"></div>
      </div>
    </div>
    <div class="acoes-form" id="acoes-times" style="${D.rascunhoTimes.length && !ro ? '' : 'display:none'}">
      <span class="muted small" style="margin-right:auto;align-self:center">${ro ? '' : '✋ Arraste pessoas entre os times para ajustar. Dois cliques no nome do time para renomear.'}</span>
      <button class="btn" id="salvar-t">Salvar times</button></div>`;
  desenharTimesEdit();
  const sortear = $('#sortear');
  if (sortear) sortear.onclick = async () => {
    if (D.rascunhoTimes.length && !(await dialogo({ titulo: 'Sortear de novo?', texto: 'A composição atual (ainda não salva) será substituída.', ok: 'Sortear' }))) return;
    const prop = await acao(sortear, () => gs('api_sortear', d.desafio.id, +$('#qtd').value));
    await animarSorteio(prop);
  };
  const salvar = $('#salvar-t');
  if (salvar) salvar.onclick = async () => {
    lerTimesEdit();
    const r = await acao(salvar, () => gs('api_timesSalvar', d.desafio.id, D.rascunhoTimes));
    D.d = r; D.rascunhoTimes = null;
    toast(rasc ? '✅ Times salvos! Agora é só iniciar o desafio.' : '✅ Times atualizados (quem mudou de time recebeu o convite)');
    if (rasc) D.passo = 'andamento';
    desenharDesafio();
  };
}

const nomeDe = (email) => (D.d.participantes.find((p) => p.email === email) || D.d.usuarios.find((u) => u.email === email) || { nome: email }).nome;
const depDe = (email) => (D.d.participantes.find((p) => p.email === email) || {}).departamento || 'Sem departamento';
const liPessoa = (email) => `<li data-email="${esc(email)}">${av(nomeDe(email), 'mini')}<span style="flex:1">${esc(nomeDe(email))}</span><span class="dep" style="--dc:${corDe(depDe(email))}">${esc(depDe(email))}</span></li>`;

function desenharTimesEdit() {
  const grid = $('#times-grid');
  if (!grid) return;
  const ro = D.d.desafio.status === 'encerrado';
  const todos = new Set(D.rascunhoTimes.flatMap((t) => t.emails));
  const semTime = D.d.participantes.filter((p) => !todos.has(p.email)).map((p) => p.email);
  grid.innerHTML = D.rascunhoTimes.map((t, i) => `<div class="time-card" style="--tc:${esc(t.cor)}" data-i="${i}">
      <h4><span class="renomear" title="Dois cliques para renomear">Time ${esc(t.nome)}</span><span class="small">${t.emails.length}</span></h4>
      <ul class="solta" data-i="${i}">${t.emails.map(liPessoa).join('')}</ul>
      <div class="mix">${t.emails.map((e) => `<i style="--dc:${corDe(depDe(e))}"></i>`).join('')}</div></div>`).join('')
    + (semTime.length && D.rascunhoTimes.length && !D.animando ? `<div class="time-card" style="--tc:var(--muted)"><h4>Sem time<span class="small">${semTime.length}</span></h4><ul class="solta" data-i="-1">${semTime.map(liPessoa).join('')}</ul></div>` : '');
  if (ro) return;
  $$('ul.solta', grid).forEach((ul) => Sortable.create(ul, { group: 'times', animation: 200, ghostClass: 'sortable-ghost', onEnd: () => { lerTimesEdit(); desenharTimesEdit(); } }));
  grid.ondblclick = async (ev) => {
    const r = ev.target.closest('.renomear');
    if (!r) return;
    const t = D.rascunhoTimes[+r.closest('.time-card').dataset.i];
    const novo = await dialogo({ titulo: 'Renomear time', campo: 'Nome do time', valor: t.nome, ok: 'Salvar' });
    if (novo && novo.trim()) { lerTimesEdit(); t.nome = novo.trim().replace(/^time\s+/i, ''); desenharTimesEdit(); }
  };
}
function lerTimesEdit() {
  $$('#times-grid ul.solta').forEach((ul) => {
    const i = +ul.dataset.i;
    if (i >= 0) D.rascunhoTimes[i].emails = $$('li', ul).map((li) => li.dataset.email);
  });
}

async function animarSorteio(proposta) {
  D.animando = true;
  D.rascunhoTimes = proposta.map((t) => ({ nome: t.nome, cor: t.cor, emails: [] }));
  const slot = $('#slot');
  slot.style.display = '';
  $('#acoes-times').style.display = 'none';
  desenharTimesEdit();
  const nome = slot.querySelector('.nome-slot');
  const todos = D.d.participantes;
  // revela em rodadas: 1 pessoa de cada time por vez, como numa mesa de sorteio
  const fila = [];
  const maior = Math.max(...proposta.map((t) => t.membros.length));
  for (let r = 0; r < maior; r++) proposta.forEach((t, i) => t.membros[r] && fila.push({ p: t.membros[r], i }));
  const rapido = fila.length > 30;
  for (const { p, i } of fila) {
    slot.classList.add('girando');
    for (let k = 0; k < (rapido ? 4 : 8); k++) { const x = todos[Math.floor(Math.random() * todos.length)]; nome.innerHTML = `${esc(x.nome)}<small>${esc(x.departamento || '')}</small>`; await espera(40 + k * 12); }
    slot.classList.remove('girando');
    nome.innerHTML = `${esc(p.nome)}<small>${esc(p.departamento || '')} → Time ${esc(proposta[i].nome)}</small>`;
    nome.animate([{ transform: 'scale(1.15)' }, { transform: 'scale(1)' }], { duration: 300 });
    const ul = $(`#times-grid ul[data-i="${i}"]`);
    await voar(p.nome, slot, ul, rapido ? 380 : 560);
    D.rascunhoTimes[i].emails.push(p.email);
    ul.insertAdjacentHTML('beforeend', liPessoa(p.email));
    const card = ul.closest('.time-card');
    card.querySelector('h4 .small').textContent = D.rascunhoTimes[i].emails.length;
    card.querySelector('.mix').insertAdjacentHTML('beforeend', `<i style="--dc:${corDe(p.departamento || 'Sem departamento')}"></i>`);
  }
  nome.innerHTML = 'Times formados! 🎉<small>Ajuste se quiser e clique em "Salvar times"</small>';
  confete();
  D.animando = false;
  desenharTimesEdit();
  $('#acoes-times').style.display = '';
}
async function voar(texto, de, para, ms = 560) {
  const a = de.getBoundingClientRect(), b = para.getBoundingClientRect();
  const v = document.createElement('div');
  v.className = 'voador';
  v.textContent = texto;
  v.style.transitionDuration = ms / 1000 + 's';
  document.body.appendChild(v);
  v.style.left = a.left + a.width / 2 - 60 + 'px'; v.style.top = a.top + a.height / 2 - 18 + 'px';
  await espera(30);
  v.style.left = b.left + 16 + 'px'; v.style.top = b.bottom - 34 + 'px'; v.style.transform = 'scale(.8)'; v.style.opacity = '.4';
  await espera(ms);
  v.remove();
}

/* ---------- andamento: iniciar, acompanhar, reabrir etapas, encerrar ---------- */
function passoAndamento(el) {
  const { d } = D;
  const x = d.desafio;
  const st = x.status;
  const botoes = {
    rascunho: `<button class="btn grad" data-st="iniciar">🚀 Iniciar desafio e enviar convites</button>`,

    apresentacao: `<a class="btn" data-go="/painel/${esc(x.id)}">📡 Painel ao vivo</a><button class="btn sec" data-st="em_andamento">↩ Voltar ao andamento</button><button class="btn grad" data-st="encerrado">🏁 Encerrar desafio</button>`,
    encerrado: `<button class="btn sec" data-st="apresentacao">↩ Reabrir para apresentação</button><a class="btn grad" data-go="/desafio/novo">+ Novo desafio</a>`,
  }[st];
  const dica = {
    rascunho: 'Ao iniciar, cada participante recebe por e-mail o problema, o time, os colegas, os prazos e o link da sala do time.',
    em_andamento: 'Os times estão trabalhando. Etapas com prazo vencido ficam somente leitura; clique numa etapa vermelha para reabri-la para o time.',
    apresentacao: 'Hora do pitch! Todos os participantes podem ver o trabalho dos outros times. As etapas estão somente leitura.',
    encerrado: 'Desafio encerrado: tudo foi guardado no Acervo de ideias.',
  }[st];
  const agora = Date.now();
  const prazo = { gut: x.prazoGut, csd: x.prazoCsd, plano: x.prazoPlano, ideias: x.prazoIdeias };
  el.innerHTML = `<div class="card" style="margin-bottom:16px"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">${statusTag(st)}<span class="muted">${dica}</span></div>
      <div class="acoes-form" style="justify-content:flex-start">${botoes}</div></div>
    ${d.times.length ? `<div class="times-grid">${d.times.map((t) => `<div class="time-card" style="--tc:${esc(t.cor)}">
      <h4>Time ${esc(t.nome)}<span class="small">${t.emails.length} pessoa(s)</span></h4>
      <ul>${t.emails.map(liPessoa).join('')}</ul>
      <div class="etapas-mini">${ETAPAS.map((e) => {
        const ok = t.concluidas.includes(e), reab = t.reabertas.includes(e), venc = !ok && prazo[e] && agora > fimDoPrazo(prazo[e]);
        const cls = ok ? 'ok' : reab ? 'reab' : venc ? 'venc' : '';
        const tip = ok ? 'Concluída' : reab ? 'Reaberta — clique para fechar' : venc ? 'Prazo vencido — clique para reabrir' : 'Em aberto';
        return `<span class="etapa-chip ${cls}" title="${tip}" ${st === 'em_andamento' && (reab || venc) ? `data-reabrir="${esc(t.id)}" data-etapa="${e}" data-abrir="${reab ? '' : '1'}"` : ''}>${ok ? '✓ ' : reab ? '🔓 ' : venc ? '⏰ ' : ''}${esc(FASE[e].sub)}</span>`;
      }).join('')}</div>
      ${st !== 'rascunho' ? `<div class="acoes-time"><a class="btn sec peq" data-go="/time/${esc(t.id)}">Abrir sala</a><a class="btn sec peq" data-go="/apresentar/${esc(t.id)}">🎤 Slides</a></div>` : ''}
    </div>`).join('')}</div>` : '<div class="card vazio"><div class="ico">🎲</div>Os times ainda não foram formados.</div>'}`;
  el.onclick = async (ev) => {
    const r = ev.target.closest('[data-reabrir]');
    if (r) {
      D.d = await acao(null, () => gs('api_etapaReabrir', r.dataset.reabrir, r.dataset.etapa, !!r.dataset.abrir));
      toast(r.dataset.abrir ? '🔓 Etapa reaberta para o time' : '🔒 Etapa fechada novamente');
      return desenharDesafio();
    }
    const b = ev.target.closest('[data-st]');
    if (!b) return;
    const alvo = b.dataset.st;
    if (alvo === 'iniciar') {
      if (!(await dialogo({ titulo: 'Iniciar o desafio?', texto: `${d.participantes.length} pessoa(s) vão receber o convite por e-mail agora.`, ok: '🚀 Iniciar' }))) return;
      const r2 = await acao(b, () => gs('api_desafioIniciar', x.id));
      D.d = r2;
      confete();
      conquista('🚀', 'Desafio lançado!', `${r2.enviados} convite(s) enviado(s)`);
      return desenharDesafio();
    }
    const txt = { apresentacao: ['Abrir as apresentações?', 'As etapas ficam somente leitura e todos podem ver os outros times.'], encerrado: ['Encerrar o desafio?', 'Tudo fica somente leitura e vai para o Acervo de ideias.'], em_andamento: ['Voltar ao andamento?', 'Os times poderão editar de novo dentro dos prazos.'] }[alvo];
    if (!(await dialogo({ titulo: txt[0], texto: txt[1], ok: 'Confirmar' }))) return;
    D.d = await acao(b, () => gs('api_desafioStatus', x.id, alvo));
    if (alvo === 'encerrado') { confete(); conquista('🏁', 'Desafio encerrado!', 'Obrigado a todos os times'); }
    desenharDesafio();
  };
}

      <td>${u.departamento ? `<span class="dep" style="--dc:${corDe(u.departamento)}">${esc(u.departamento)}</span>` : '<span class="muted">—</span>'}</td><td>${esc(u.funcao || '—')}</td>

        <div><label class="campo">Função</label><input name="funcao" value="${esc(u.funcao)}"></div></div>
      <datalist id="dl-deps">${deps().map((d) => `<option value="${esc(d)}">`).join('')}</datalist>
      <div class="cols2"><div><label class="campo">Papel</label><select name="papel" ${ME.admin ? '' : 'disabled'}>${Object.entries(PAPEL).map(([k, t]) => `<option value="${k}" ${u.papel === k ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
        <div><label class="campo">Situação</label><select name="ativo"><option value="1" ${u.ativo ? 'selected' : ''}>Ativo</option><option value="" ${u.ativo ? '' : 'selected'}>Inativo</option></select></div></div>
      ${ME.admin ? '' : '<p class="muted small">Só administradores definem facilitadores e administradores.</p>'}

    if (n < 0 || n >= S.length || n === at) return;
    const sl = $$('.slide', el);
    sl[at].classList.remove('on'); sl[at].classList.add('sai');
    setTimeout(() => sl.forEach((x) => x.classList.remove('sai')), 600);
    at = n; sl[n].classList.add('on');
    $$('.slides-nav i', el).forEach((i, k) => i.classList.toggle('on', k === n));
    if (n === S.length - 1) confete();
  };
  $('#sl-prev').onclick = () => ir(at - 1);
  $('#sl-next').onclick = () => ir(at + 1);
  $('#sl-fs').onclick = () => { const w = $('#slides'); document.fullscreenElement ? document.exitFullscreen() : w.requestFullscreen && w.requestFullscreen(); };
  $$('.slides-nav i', el).forEach((i) => (i.onclick = () => ir(+i.dataset.i)));
  $('#slides').onclick = (ev) => { if (!ev.target.closest('button, .slides-nav')) ir(at + 1); };
  const tecla = (e) => {
    if (e.target.matches('input, textarea')) return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); ir(at + 1); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') ir(at - 1);
    if (e.key.toLowerCase() === 'f') $('#sl-fs').click();
  };
  addEventListener('keydown', tecla);

/* ============================== ACERVO DE IDEIAS ============================== */
ROTAS.historico = async (el) => {
  carregando(el);
  let lista;
  try { lista = await gs('api_historico'); } catch (e) { return el.isConnected && falha(el, e); }
  if (!el.isConnected) return; // o usuário já foi para outra tela
  el.innerHTML = `<div class="cab-pag"><div><h1 class="pag">Acervo de ideias</h1><p class="sub-pag">Problemas enfrentados e ideias propostas pelos times em todos os desafios.</p></div><span class="espaco"></span>
    <input class="inp" id="busca-h" placeholder="🔎 Buscar problema ou ideia" style="max-width:320px"></div><div id="hist"></div>`;
  const marcar = (txt, q) => {
    const t = esc(txt);
    if (!q) return t;
    const i = String(txt).toLowerCase().indexOf(q);
    return i < 0 ? t : esc(txt.slice(0, i)) + '<mark>' + esc(txt.slice(i, i + q.length)) + '</mark>' + esc(txt.slice(i + q.length));
  };
  const desenhar = (q) => {
    const tem = (s) => !q || String(s || '').toLowerCase().includes(q);
    const vis = lista.filter((d) => tem(d.titulo) || tem(d.problema) || d.times.some((t) => tem(t.microproblema && t.microproblema.texto) || t.ideias.some((i) => tem(i.titulo) || tem(i.descricao))));
    $('#hist').innerHTML = vis.map((d) => `<div class="card" style="margin-bottom:16px">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="num muted small" style="font-weight:800;letter-spacing:1px">DESAFIO #${esc(d.numero)}</span>${statusTag(d.status)}
        <span class="muted small">${d.encerradoEm ? 'encerrado em ' + fmtDataHora(d.encerradoEm) : ''}</span></div>
      <h3 style="margin:6px 0 4px;font-size:19px">${marcar(d.titulo, q)}</h3>${d.problema ? `<p class="muted" style="margin:0 0 10px">${marcar(d.problema, q)}</p>` : ''}
      ${d.times.map((t) => `<div class="hist-time"><div><b style="color:${esc(t.cor)}">● Time ${esc(t.nome)}</b><div class="small muted">${t.microproblemas} microproblema(s) · ${t.postits} post-it(s)</div>
          <a class="btn sec peq" style="margin-top:8px" data-go="/apresentar/${esc(t.id)}">🎤 Ver slides</a></div>
        <div>${t.microproblema ? `<div style="margin-bottom:8px"><span class="small muted">👑 Microproblema</span><div><b>${marcar(t.microproblema.texto, q)}</b> <span class="small muted">(grau ${t.microproblema.grau})</span></div></div>` : ''}
          <div class="hist-ideias">${t.ideias.map((i, k) => `<div>${['🥇', '🥈', '🥉'][k] || '•'} <b>${marcar(i.titulo, q)}</b>${i.descricao ? ` <span class="muted">— ${marcar(i.descricao, q)}</span>` : ''}</div>`).join('') || '<span class="muted small">Sem ideias registradas.</span>'}</div></div></div>`).join('')}
    </div>`).join('') || `<div class="card vazio"><div class="ico">📚</div>${q ? 'Nada encontrado.' : 'O acervo começa a ser preenchido quando o primeiro desafio chega à apresentação.'}</div>`;
  };
  desenhar('');
  $('#busca-h').oninput = (ev) => desenhar(ev.target.value.trim().toLowerCase());
};
</script>
